version: 2
updates:
- package-ecosystem: nuget
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  ignore:
  - dependency-name: Microsoft.PowerShell.SDK
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  groups:
    all-dependencies:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
