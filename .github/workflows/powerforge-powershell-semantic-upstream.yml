name: PowerForge PowerShell Semantic Upstream Review

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  review-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Compare immutable semantic pins with upstream releases
        shell: pwsh
        run: >-
          ./Build/Invoke-PowerShellSemanticUpstreamMonitor.ps1
          -OutputPath ./artifacts/powershell-semantic-upstream-review.json
          -FailOnChange

      - name: Upload review proposal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powershell-semantic-upstream-review
          path: artifacts/powershell-semantic-upstream-review.json
          if-no-files-found: error
          retention-days: 30
