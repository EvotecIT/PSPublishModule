name: Server Recovery Validation Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/powerforge-server-recovery-validate/**"
      - ".github/workflows/server-recovery-validation-tests.yml"
      - "Deployment/Linux/powerforge-server-encrypted-capture.sh"
      - "Deployment/Linux/powerforge-server-data-capture.sh"
      - "Deployment/Linux/tests/powerforge-server-data-capture-sqlite-fixture.sh"
      - "PowerForge.Tests/GitHubServerRecoveryValidation*.cs"
      - "PowerForge.Tests/ServerRecovery*.cs"
      - "PowerForge.Tests/ServerScaffoldTests.cs"
      - "PowerForge.Tests/WebCliServerCaptureTests.cs"
      - "PowerForge.Web.Cli/ServerScaffoldTemplateStore.cs"
      - "PowerForge.Web.Cli/ServerRecoveryModels.cs"
      - "PowerForge.Web.Cli/ServerRecoveryDurableBackupModels.cs"
      - "PowerForge.Web.Cli/Templates/ServerScaffold/**"
      - "PowerForge.Web.Cli/WebCliCommandHandlers.Server*.cs"
      - "Schemas/powerforge.web.serverrecovery.schema.json"
  pull_request:
    paths:
      - ".github/actions/powerforge-server-recovery-validate/**"
      - ".github/workflows/server-recovery-validation-tests.yml"
      - "Deployment/Linux/powerforge-server-encrypted-capture.sh"
      - "Deployment/Linux/powerforge-server-data-capture.sh"
      - "Deployment/Linux/tests/powerforge-server-data-capture-sqlite-fixture.sh"
      - "PowerForge.Tests/GitHubServerRecoveryValidation*.cs"
      - "PowerForge.Tests/ServerRecovery*.cs"
      - "PowerForge.Tests/ServerScaffoldTests.cs"
      - "PowerForge.Tests/WebCliServerCaptureTests.cs"
      - "PowerForge.Web.Cli/ServerScaffoldTemplateStore.cs"
      - "PowerForge.Web.Cli/ServerRecoveryModels.cs"
      - "PowerForge.Web.Cli/ServerRecoveryDurableBackupModels.cs"
      - "PowerForge.Web.Cli/WebCliCommandHandlers.Server*.cs"
      - "Schemas/powerforge.web.serverrecovery.schema.json"
      - "!**/*.md"
      - "!**/*.MD"
      # Templates are build inputs, including ONBOARDING.md.
      - "PowerForge.Web.Cli/Templates/ServerScaffold/**"
  workflow_dispatch:

permissions:
  contents: read

# First attempts supersede the same PR; reruns and non-PR runs have separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  ServerRecoveryValidationTests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dotnet
      - name: Restore focused test graph
        run: dotnet restore ./PowerForge.Tests/PowerForge.Tests.csproj --force-evaluate

      - name: Run server recovery validation tests
        run: >-
          dotnet test ./PowerForge.Tests/PowerForge.Tests.csproj
          -c Release
          --no-restore
          --filter 'FullyQualifiedName~GitHubServerRecoveryValidation|FullyQualifiedName~ServerRecovery|FullyQualifiedName~ServerScaffoldTests|FullyQualifiedName~WebCliServerCaptureTests'

      - name: Prove encrypted SQLite capture and restore
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age jq postgresql rsync sqlite3 shellcheck
          sudo service postgresql start
          pg_isready -q
          bash -n Deployment/Linux/powerforge-server-data-capture.sh Deployment/Linux/tests/powerforge-server-data-capture-sqlite-fixture.sh
          shellcheck Deployment/Linux/powerforge-server-data-capture.sh Deployment/Linux/tests/powerforge-server-data-capture-sqlite-fixture.sh
          sudo bash Deployment/Linux/tests/powerforge-server-data-capture-sqlite-fixture.sh
