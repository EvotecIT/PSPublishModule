name: Server Recovery Validation Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/powerforge-server-recovery-validate/**"
      - ".github/workflows/server-recovery-validation-tests.yml"
      - "Deployment/Linux/powerforge-server-encrypted-capture.sh"
      - "PowerForge.Tests/GitHubServerRecoveryValidation*.cs"
      - "PowerForge.Tests/ServerRecovery*.cs"
      - "PowerForge.Tests/ServerScaffoldTests.cs"
      - "PowerForge.Tests/WebCliServerCaptureTests.cs"
      - "PowerForge.Web.Cli/ServerScaffoldTemplateStore.cs"
      - "PowerForge.Web.Cli/ServerRecoveryModels.cs"
      - "PowerForge.Web.Cli/Templates/ServerScaffold/**"
      - "PowerForge.Web.Cli/WebCliCommandHandlers.Server*.cs"
      - "Schemas/powerforge.web.serverrecovery.schema.json"
  pull_request:
    paths:
      - ".github/actions/powerforge-server-recovery-validate/**"
      - ".github/workflows/server-recovery-validation-tests.yml"
      - "Deployment/Linux/powerforge-server-encrypted-capture.sh"
      - "PowerForge.Tests/GitHubServerRecoveryValidation*.cs"
      - "PowerForge.Tests/ServerRecovery*.cs"
      - "PowerForge.Tests/ServerScaffoldTests.cs"
      - "PowerForge.Tests/WebCliServerCaptureTests.cs"
      - "PowerForge.Web.Cli/ServerScaffoldTemplateStore.cs"
      - "PowerForge.Web.Cli/ServerRecoveryModels.cs"
      - "PowerForge.Web.Cli/Templates/ServerScaffold/**"
      - "PowerForge.Web.Cli/WebCliCommandHandlers.Server*.cs"
      - "Schemas/powerforge.web.serverrecovery.schema.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ServerRecoveryValidationTests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore focused test graph
        run: dotnet restore ./PowerForge.Tests/PowerForge.Tests.csproj --force-evaluate

      - name: Run server recovery validation tests
        run: >-
          dotnet test ./PowerForge.Tests/PowerForge.Tests.csproj
          -c Release
          --no-restore
          --filter 'FullyQualifiedName~GitHubServerRecoveryValidation|FullyQualifiedName~ServerRecovery|FullyQualifiedName~ServerScaffoldTests|FullyQualifiedName~WebCliServerCaptureTests'
