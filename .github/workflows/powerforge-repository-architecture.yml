name: PowerForge Repository Architecture

on:
  workflow_call:
    inputs:
      config_path:
        description: Architecture config path in the caller repository.
        required: false
        default: .powerforge/architecture.json
        type: string
      powerforge_ref:
        description: Exact PSPublishModule commit containing the shared engine and action.
        required: true
        type: string
      base_ref:
        description: Optional Git base ref override.
        required: false
        default: ""
        type: string
      head_ref:
        description: Optional Git head ref override.
        required: false
        default: ""
        type: string
      run_evidence:
        description: Run impact-selected workspace validation evidence.
        required: false
        default: true
        type: boolean
      report_artifact_name:
        description: Uploaded architecture report artifact name.
        required: false
        default: powerforge-architecture-reports
        type: string

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate immutable PowerForge source ref
        shell: pwsh
        env:
          POWERFORGE_REF: ${{ inputs.powerforge_ref }}
        run: |
          if ($env:POWERFORGE_REF -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'powerforge_ref must be an exact 40-character commit SHA.'
          }

      - name: Checkout pinned PowerForge source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: EvotecIT/PSPublishModule
          ref: ${{ inputs.powerforge_ref }}
          path: .powerforge/runtime

      - name: Resolve impact refs
        id: refs
        shell: pwsh
        env:
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_HEAD_REF: ${{ inputs.head_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          $baseRef = [string]$env:INPUT_BASE_REF
          $headRef = [string]$env:INPUT_HEAD_REF
          if ([string]::IsNullOrWhiteSpace($baseRef)) {
            if (-not [string]::IsNullOrWhiteSpace($env:EVENT_BASE_SHA)) {
              $baseRef = $env:EVENT_BASE_SHA
              $headRef = $env:EVENT_HEAD_SHA
            } elseif (-not [string]::IsNullOrWhiteSpace($env:EVENT_BEFORE_SHA) -and $env:EVENT_BEFORE_SHA -notmatch '^0+$') {
              $baseRef = $env:EVENT_BEFORE_SHA
              $headRef = $env:EVENT_SHA
            }
          }
          "base-ref=$baseRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head-ref=$headRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify repository architecture
        id: architecture
        uses: ./.powerforge/runtime/.github/actions/repository-architecture
        with:
          source-root: ${{ github.workspace }}/.powerforge/runtime
          repository-root: ${{ github.workspace }}
          config-path: ${{ inputs.config_path }}
          base-ref: ${{ steps.refs.outputs.base-ref }}
          head-ref: ${{ steps.refs.outputs.head-ref }}
          run-evidence: ${{ inputs.run_evidence && 'true' || 'false' }}

      - name: Upload architecture reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.report_artifact_name }}
          path: |
            ${{ steps.architecture.outputs.report-json }}
            ${{ steps.architecture.outputs.summary-markdown }}
          if-no-files-found: ignore
