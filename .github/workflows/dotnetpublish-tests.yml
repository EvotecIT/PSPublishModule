name: DotNetPublish Focused Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

on:
  pull_request:
    paths:
      - PowerForge/**
      - PowerForge.Cli/**
      - PowerForge.Tests/**
      - PSPublishModule/**
      - Schemas/**
      - .github/workflows/dotnetpublish-tests.yml
  workflow_dispatch:
    inputs:
      include_deep_validation:
        description: Run the exhaustive DotNetPublish adversarial matrix
        required: false
        default: false
        type: boolean

jobs:
  DotNetPublishTests:
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'NuGet.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore focused test graph
        shell: pwsh
        run: dotnet restore ./PowerForge.Tests/PowerForge.Tests.csproj --force-evaluate

      - name: Run DotNetPublish focused tests
        shell: pwsh
        run: >-
          dotnet test ./PowerForge.Tests/PowerForge.Tests.csproj
          -c Release
          --no-restore
          --filter 'Category=DotNetPublishPrGate'
          --logger 'console;verbosity=normal'
          --blame-hang
          --blame-hang-timeout 5m

  DotNetPublishDeepTests:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_deep_validation }}
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'NuGet.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore deep test graph
        shell: pwsh
        run: dotnet restore ./PowerForge.Tests/PowerForge.Tests.csproj --force-evaluate

      - name: Run exhaustive DotNetPublish tests
        shell: pwsh
        run: >-
          dotnet test ./PowerForge.Tests/PowerForge.Tests.csproj
          -c Release
          --no-restore
          --filter 'FullyQualifiedName~DotNetPublish'
          --logger 'console;verbosity=normal'
          --blame-hang
          --blame-hang-timeout 5m
