name: DotNetPublish Focused Tests

# First attempts supersede the same PR; reruns and non-PR runs have separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

on:
  pull_request:
    paths:
      - PowerForge/**
      - PowerForge.Cli/**
      - PowerForge.PowerShell/**
      - PowerForge.Tests/**
      - PSPublishModule/**
      - Schemas/**
      - .github/workflows/dotnetpublish-tests.yml
  workflow_dispatch:
    inputs:
      include_deep_validation:
        description: Run the exhaustive DotNetPublish adversarial matrix
        required: false
        default: false
        type: boolean

jobs:
  DotNetPublishTestShards:
    name: DotNetPublishTests (${{ matrix.shard }}/5)
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    # Include headroom for the cold NuGet cache upload after the focused matrix.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in step with the shard count passed to Get-TestShardFilter.ps1.
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet
      - name: Restore NuGet packages
        id: nuget-cache
        uses: ./.github/actions/cache-nuget

      - name: Restore focused test graph
        shell: pwsh
        run: dotnet restore ./PowerForge.Tests/PowerForge.Tests.csproj --force-evaluate

      - name: Build focused test graph
        shell: pwsh
        run: dotnet build ./PowerForge.Tests/PowerForge.Tests.csproj -c Release --no-restore --nologo

      - name: Select DotNetPublish test shard
        shell: pwsh
        run: >-
          ./.github/scripts/Get-TestShardFilter.ps1
          -Project ./PowerForge.Tests/PowerForge.Tests.csproj
          -BaseFilter 'Category=DotNetPublishPrGate'
          -ShardCount 5
          -ShardNumber ${{ matrix.shard }}
          -RunSettingsPath "$env:RUNNER_TEMP/dotnetpublish-shard.runsettings"

      - name: Run DotNetPublish focused tests
        shell: pwsh
        run: >-
          dotnet test ./PowerForge.Tests/PowerForge.Tests.csproj
          -c Release
          --no-restore
          --no-build
          --settings "$env:RUNNER_TEMP/dotnetpublish-shard.runsettings"
          --logger 'console;verbosity=normal'
          --blame-hang
          --blame-hang-timeout 5m

  DotNetPublishTests:
    # Keeps the original check name; it passes only when every shard passed.
    needs: DotNetPublishTestShards
    if: always()
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Require every DotNetPublish shard
        env:
          RESULT: ${{ needs.DotNetPublishTestShards.result }}
        shell: bash
        run: |
          if [[ "$RESULT" != 'success' ]]; then
            echo "DotNetPublish test shards finished with: $RESULT" >&2
            exit 1
          fi
          echo 'All DotNetPublish test shards passed.'

  DotNetPublishDeepTests:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_deep_validation }}
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet
      - name: Restore NuGet packages
        id: nuget-cache
        uses: ./.github/actions/cache-nuget

      - name: Restore deep test graph
        shell: pwsh
        run: dotnet restore ./PowerForge.Tests/PowerForge.Tests.csproj --force-evaluate

      - name: Run exhaustive DotNetPublish tests
        shell: pwsh
        run: >-
          dotnet test ./PowerForge.Tests/PowerForge.Tests.csproj
          -c Release
          --no-restore
          --filter 'FullyQualifiedName~DotNetPublish'
          --logger 'console;verbosity=normal'
          --blame-hang
          --blame-hang-timeout 5m
