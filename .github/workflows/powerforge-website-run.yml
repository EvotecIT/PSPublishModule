name: PowerForge Website Run

on:
  workflow_call:
    outputs:
      source_sha:
        description: Exact caller repository commit used to build the website.
        value: ${{ jobs.website-run.outputs.source_sha }}
      engine_repository:
        description: Repository used to build the website.
        value: ${{ jobs.website-run.outputs.engine_repository }}
      engine_sha:
        description: Exact PowerForge commit used to build the website.
        value: ${{ jobs.website-run.outputs.engine_sha }}
      engine_mode:
        description: Resolved source or binary engine mode.
        value: ${{ jobs.website-run.outputs.engine_mode }}
      engine_ref:
        description: Exact source commit or binary release tag used to build.
        value: ${{ jobs.website-run.outputs.engine_ref }}
      engine_asset:
        description: Binary release asset used to build, when applicable.
        value: ${{ jobs.website-run.outputs.engine_asset }}
      engine_asset_sha256:
        description: Exact binary release asset digest, when applicable.
        value: ${{ jobs.website-run.outputs.engine_asset_sha256 }}
      cloudflare_cache_manifest_artifact_name:
        description: Run-scoped private Cloudflare manifest artifact name, when generated.
        value: ${{ jobs.website-run.outputs.cloudflare_cache_manifest_artifact_name }}
      deployment_manifest_artifact_name:
        description: Run-scoped private deployment manifest generated from the exact site artifact.
        value: ${{ jobs.website-run.outputs.deployment_manifest_artifact_name }}
      cloudflare_cache_manifest_scope:
        description: Stable repository/site scope used by Cloudflare deployment state.
        value: ${{ jobs.website-run.outputs.cloudflare_cache_manifest_scope }}
    inputs:
      website_root:
        required: true
        type: string
      pipeline_config:
        required: true
        type: string
      source_ref:
        description: Optional caller repository ref to build instead of the event commit.
        required: false
        type: string
        default: ""
      engine_mode:
        required: false
        type: string
        default: ""
      runner_labels_json:
        required: false
        type: string
        default: '["ubuntu-latest"]'
      timeout_minutes:
        required: false
        type: number
        default: 40
      dotnet_version:
        required: false
        type: string
        default: "10.0.x"
      social-cards:
        description: 'Install social card dependencies: auto detects active site/pipeline settings; true forces setup; false skips setup.'
        required: false
        type: string
        default: 'auto'
      dotnet_workloads:
        description: Optional comma, semicolon, or whitespace-separated .NET workloads to install before running the website pipeline.
        required: false
        type: string
        default: ""
      report_artifact_name:
        required: false
        type: string
        default: "powerforge-website-reports"
      powerforge_lock_path:
        required: false
        type: string
        default: ""
      powerforge_repository:
        required: false
        type: string
        default: ""
      powerforge_ref:
        required: false
        type: string
        default: ""
      powerforge_repository_override:
        required: false
        type: string
        default: ""
      powerforge_ref_override:
        required: false
        type: string
        default: ""
      powerforge_tool_lock_path:
        required: false
        type: string
        default: ""
      powerforge_web_tag:
        required: false
        type: string
        default: ""
      pipeline_mode:
        required: false
        type: string
        default: "ci"
      credential_mode:
        description: Credential policy (none, standard, public-github). Public-github exposes only the job token in public repositories; callers must restrict its permissions to read-only.
        required: false
        type: string
        default: "standard"
      use_playwright_cache:
        required: false
        type: boolean
        default: true
      maintenance_mode_note:
        required: false
        type: boolean
        default: false
      upload_pages_artifact:
        required: false
        type: boolean
        default: false
      validate_pages_artifact:
        required: false
        type: boolean
        default: false
      pages_artifact_path:
        required: false
        type: string
        default: ""
      site_artifact_name:
        required: false
        type: string
        default: ""
      site_artifact_path:
        required: false
        type: string
        default: ""
      site_artifact_retention_days:
        required: false
        type: number
        default: 7
      generate_cloudflare_cache_manifest:
        description: Generate a private deployment manifest when site.json selects incremental Cloudflare purge.
        required: false
        type: boolean
        default: false
      generate_deployment_manifest:
        description: Generate a private manifest from the exact site artifact for post-deployment integrity verification.
        required: false
        type: boolean
        default: false
      deployment_manifest_artifact_name:
        description: Existing run artifact to download and expose as POWERFORGE_DEPLOYMENT_MANIFEST.
        required: false
        type: string
        default: ""
      deployment_base_url:
        description: Actual deployment origin used by post-deployment integrity verification.
        required: false
        type: string
        default: ""
      apidocs_shards:
        description: Jobs (1-8) that share the pipeline's consecutive apidocs steps. 1 keeps the single-job build; larger values add jobs on the same runner labels that each run the earlier steps and part of the API docs, and this job merges them before the remaining steps. Needs that many concurrent runners.
        required: false
        type: number
        default: 1
    secrets:
      indexnow_key:
        required: false
      repository_read_token:
        required: false
      cloudflare_api_token:
        required: false
      cloudflare_zone_id:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  website-run:
    outputs:
      source_sha: ${{ steps.source_provenance.outputs.sha }}
      engine_repository: ${{ steps.engine_provenance.outputs.repository }}
      engine_sha: ${{ steps.engine_provenance.outputs.sha }}
      engine_mode: ${{ steps.engine_provenance.outputs.mode }}
      engine_ref: ${{ steps.engine_provenance.outputs.ref }}
      engine_asset: ${{ steps.engine_provenance.outputs.asset }}
      engine_asset_sha256: ${{ steps.engine_provenance.outputs.asset_sha256 }}
      cloudflare_cache_manifest_artifact_name: ${{ steps.cloudflare_incremental.outputs.enabled == 'true' && steps.deployment_manifest.outputs.artifact_name || '' }}
      cloudflare_cache_manifest_scope: ${{ steps.cloudflare_incremental.outputs.scope }}
      deployment_manifest_artifact_name: ${{ steps.deployment_manifest.outputs.artifact_name }}
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      POWERFORGE_RUNNER_CACHE_ROOT: ${{ github.workspace }}/.cache/powerforge-runner
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/powerforge-runner/ms-playwright
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: ${{ github.workspace }}/.cache/powerforge-runner/dotnet-bundle
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/powerforge-runner/bun-install-cache
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/powerforge-runner/npm-cache
      POWERFORGE_DEPLOYMENT_BASE_URL: ${{ inputs.deployment_base_url }}
    steps:
      - name: Validate credential mode
        shell: pwsh
        env:
          POWERFORGE_CREDENTIAL_MODE: ${{ inputs.credential_mode }}
          POWERFORGE_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && github.event.repository.visibility == 'public' }}
        run: |
          if ($env:POWERFORGE_CREDENTIAL_MODE -notin @('none', 'standard', 'public-github')) {
            throw "Unsupported credential_mode '$env:POWERFORGE_CREDENTIAL_MODE'. Expected none, standard or public-github."
          }
          if ($env:POWERFORGE_CREDENTIAL_MODE -eq 'public-github' -and $env:POWERFORGE_PUBLIC_REPOSITORY -ne 'true') {
            throw 'public-github credentials require a verified public repository.'
          }

      - name: Validate API docs shard count
        if: ${{ inputs.apidocs_shards != 1 }}
        shell: pwsh
        env:
          POWERFORGE_APIDOCS_SHARDS: ${{ inputs.apidocs_shards }}
          POWERFORGE_DEPLOYMENT_MANIFEST_ARTIFACT: ${{ inputs.deployment_manifest_artifact_name }}
        run: |
          if ($env:POWERFORGE_APIDOCS_SHARDS -notmatch '^[2-8]$') {
            throw "apidocs_shards must be a whole number from 1 to 8, got '$env:POWERFORGE_APIDOCS_SHARDS'."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:POWERFORGE_DEPLOYMENT_MANIFEST_ARTIFACT)) {
            throw 'apidocs_shards applies to website builds, not post-deployment verification runs.'
          }

      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}
          persist-credentials: ${{ inputs.credential_mode == 'standard' }}
          # workflow_call can otherwise default to refs/pull/<n>/merge, which is not available in some repos.
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Resolve website source provenance
        id: source_provenance
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sourceSha -notmatch '^[a-f0-9]{40,64}$') {
            throw "Unable to resolve the exact website source commit."
          }

          "sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve shared workflow source
        id: workflow_source
        shell: pwsh
        run: |
          $resolvedRepository = [string]'${{ inputs.powerforge_repository }}'
          $resolvedRef = [string]'${{ inputs.powerforge_ref }}'
          $workflowRepository = [string]'${{ job.workflow_repository }}'
          $workflowRef = [string]'${{ job.workflow_ref }}'
          $workflowSha = [string]'${{ job.workflow_sha }}'

          if ([string]::IsNullOrWhiteSpace($resolvedRepository)) {
            $resolvedRepository = $workflowRepository
          }

          if ([string]::IsNullOrWhiteSpace($resolvedRepository)) {
            $resolvedRepository = 'EvotecIT/PSPublishModule'
          }

          if ([string]::IsNullOrWhiteSpace($resolvedRef)) {
            $resolvedRef = $workflowSha
          }

          if ([string]::IsNullOrWhiteSpace($resolvedRef)) {
            throw "Unable to resolve the shared workflow commit SHA from job.workflow_sha. Pass powerforge_ref explicitly."
          }

          Write-Host "Resolved shared workflow source from $workflowRef to $resolvedRepository@$resolvedRef"
          "repository=$resolvedRepository" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ref=$resolvedRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout shared PowerForge runner
        id: shared_runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.workflow_source.outputs.repository }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: ./.powerforge-runner
          token: ${{ github.token }}
          persist-credentials: ${{ inputs.credential_mode == 'standard' }}
          fetch-depth: 1

      - name: Checkout shared cache policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ./.powerforge-cache-policy
          sparse-checkout: .github/actions/cache-nuget
          persist-credentials: false
          fetch-depth: 1

      - name: Setup .NET
        uses: ./.powerforge-runner/.github/actions/setup-dotnet
        with:
          global-json-file: ${{ hashFiles('global.json') != '' && 'global.json' || '.powerforge-runner/global.json' }}
      - name: Select hosted npm cache directory
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          "NPM_CONFIG_CACHE=$(Join-Path $env:RUNNER_TEMP 'powerforge-npm-cache')" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        id: nuget-cache
        uses: ./.powerforge-cache-policy/.github/actions/cache-nuget

      - name: Restore npm cache
        id: npm-cache
        if: runner.environment == 'github-hosted' && hashFiles('**/package-lock.json', '!**/node_modules/**', '!**/obj/**', '!**/bin/**') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: powerforge-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '!**/node_modules/**', '!**/obj/**', '!**/bin/**') }}
          restore-keys: |
            powerforge-npm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare social card renderer
        shell: pwsh
        env:
          POWERFORGE_SOCIAL_CARDS: ${{ inputs.social-cards }}
          POWERFORGE_PIPELINE_CONFIG: ${{ inputs.pipeline_config }}
          POWERFORGE_PIPELINE_MODE: ${{ inputs.pipeline_mode }}
          POWERFORGE_WEBSITE_ROOT: ${{ inputs.website_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $selection = $env:POWERFORGE_SOCIAL_CARDS.ToLowerInvariant()
          if ($selection -notin @('auto', 'true', 'false')) {
            throw 'social-cards must be auto, true or false.'
          }
          $enabled = $selection -eq 'true'
          if ($selection -eq 'auto') {
            $restoreConfig = Join-Path $env:GITHUB_WORKSPACE '.powerforge-runner/.github/nuget.public.config'
            $output = @(dotnet run --framework net10.0 -p:RestoreLockedMode=false "-p:RestoreConfigFile=$restoreConfig" --project ./.powerforge-runner/PowerForge.Web.Cli/PowerForge.Web.Cli.csproj -- website-runner --website-root $env:POWERFORGE_WEBSITE_ROOT --pipeline-config $env:POWERFORGE_PIPELINE_CONFIG --pipeline-mode $env:POWERFORGE_PIPELINE_MODE --check-social-cards)
            if ($LASTEXITCODE -ne 0 -or $output.Count -eq 0 -or $output[-1] -notin @('true', 'false')) {
              throw 'Unable to determine social card requirements from the website pipeline.'
            }
            $enabled = $output[-1] -eq 'true'
          }
          & ./.powerforge-runner/.github/scripts/Install-WebsiteSocialCardDependencies.ps1 -Enabled $enabled

      - name: Install requested .NET workloads
        if: ${{ inputs.dotnet_workloads != '' }}
        shell: pwsh
        env:
          DOTNET_WORKLOADS: ${{ inputs.dotnet_workloads }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workloads = @(
            $env:DOTNET_WORKLOADS -split '[,;\s]+' |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique
          )

          if ($workloads.Count -eq 0) {
            throw 'dotnet_workloads did not contain a workload identifier.'
          }

          foreach ($workload in $workloads) {
            if ($workload -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
              throw "Invalid .NET workload identifier '$workload'."
            }
          }

          dotnet workload install @workloads --skip-manifest-update
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet workload install failed with exit code $LASTEXITCODE."
          }

      - name: Download exact deployment manifest
        if: ${{ inputs.deployment_manifest_artifact_name != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.deployment_manifest_artifact_name }}
          path: ${{ runner.temp }}/powerforge-deployment-manifest

      - name: Initialize transient tool cache directories
        shell: pwsh
        run: |
          foreach ($path in @(
            $env:POWERFORGE_RUNNER_CACHE_ROOT,
            $env:NUGET_PACKAGES,
            $env:PLAYWRIGHT_BROWSERS_PATH,
            $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR,
            $env:BUN_INSTALL_CACHE_DIR,
            $env:NPM_CONFIG_CACHE
          )) {
            if (-not [string]::IsNullOrWhiteSpace($path)) {
              New-Item -ItemType Directory -Force -Path $path | Out-Null
            }
          }

      - name: Prepare website pipeline and API docs shard 1
        if: ${{ inputs.apidocs_shards > 1 }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ (inputs.credential_mode == 'standard' || (inputs.credential_mode == 'public-github' && github.event.repository.private == false && github.event.repository.visibility == 'public')) && github.token || '' }}
          # Prevent an ambient runner CLI credential from overriding this policy.
          GH_TOKEN: ''
          GITHUB_PACKAGES_TOKEN: ${{ inputs.credential_mode == 'standard' && (secrets.repository_read_token || github.token) || '' }}
          LICENSING_PACKAGES_TOKEN: ${{ inputs.credential_mode == 'standard' && (secrets.repository_read_token || github.token) || '' }}
          LICENSING_PACKAGES_USERNAME: ${{ inputs.credential_mode == 'standard' && github.repository_owner || '' }}
          INDEXNOW_KEY: ${{ inputs.credential_mode == 'standard' && secrets.indexnow_key || '' }}
          POWERFORGE_REPOSITORY_TOKEN: ${{ inputs.credential_mode == 'standard' && secrets.repository_read_token || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.credential_mode == 'standard' && secrets.cloudflare_api_token || '' }}
          CLOUDFLARE_ZONE_ID: ${{ inputs.credential_mode == 'standard' && secrets.cloudflare_zone_id || '' }}
          POWERFORGE_RUNNER_RESULT_PATH: ${{ runner.temp }}/powerforge-website-runner-result.json
          POWERFORGE_APIDOCS_SHARDS: ${{ inputs.apidocs_shards }}
        run: |
          $runnerRestoreConfig = Join-Path $env:GITHUB_WORKSPACE '.powerforge-runner/.github/nuget.public.config'
          if (-not (Test-Path -LiteralPath $runnerRestoreConfig -PathType Leaf)) {
            throw "PowerForge runner NuGet configuration not found: $runnerRestoreConfig"
          }

          $runnerArgs = @(
            'website-runner',
            '--website-root', '${{ inputs.website_root }}',
            '--pipeline-config', '${{ inputs.pipeline_config }}',
            '--engine-mode', '${{ inputs.engine_mode }}',
            '--pipeline-mode', '${{ inputs.pipeline_mode }}',
            '--powerforge-lock-path', '${{ inputs.powerforge_lock_path }}',
            '--powerforge-repository', '${{ inputs.powerforge_repository }}',
            '--powerforge-ref', '${{ startsWith(inputs.powerforge_ref, 'actions-') && steps.shared_runner.outputs.commit || inputs.powerforge_ref }}',
            '--powerforge-repository-override', '${{ inputs.powerforge_repository_override }}',
            '--powerforge-ref-override', '${{ inputs.powerforge_ref_override }}',
            '--powerforge-tool-lock-path', '${{ inputs.powerforge_tool_lock_path }}',
            '--powerforge-web-tag', '${{ inputs.powerforge_web_tag }}',
            '--result-path', $env:POWERFORGE_RUNNER_RESULT_PATH
          )

          # Steps up to the apidocs block plus shard 1; the website pipeline step below runs the rest.
          $runnerArgs += @('--split-phase', 'prepare', '--apidocs-shard', "1/$($env:POWERFORGE_APIDOCS_SHARDS)",
            '--split-archive', (Join-Path $env:RUNNER_TEMP 'powerforge-apidocs-shards/1/shard.tar'))

          dotnet run --framework net10.0 -p:RestoreLockedMode=false "-p:RestoreConfigFile=$runnerRestoreConfig" --project ./.powerforge-runner/PowerForge.Web.Cli/PowerForge.Web.Cli.csproj -- $runnerArgs

      - name: Collect API docs shards
        if: ${{ inputs.apidocs_shards > 1 }}
        # Inline and profile-free: the website workspace ran repository code and must not supply code that sees the token.
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          # Read-only artifact access stays out of the steps that run website code.
          GITHUB_TOKEN: ${{ github.token }}
          POWERFORGE_REPORT_ARTIFACT_NAME: ${{ inputs.report_artifact_name }}
          POWERFORGE_APIDOCS_SHARDS: ${{ inputs.apidocs_shards }}
          POWERFORGE_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          $prefix = "$($env:POWERFORGE_REPORT_ARTIFACT_NAME)-apidocs-shard"
          $shardCount = [int]$env:POWERFORGE_APIDOCS_SHARDS
          $timeoutMinutes = [int]$env:POWERFORGE_TIMEOUT_MINUTES
          $destination = Join-Path $env:RUNNER_TEMP 'powerforge-apidocs-shards'
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
              throw 'GITHUB_TOKEN with actions: read is required to collect API docs shards.'
          }
          $headers = @{
              Authorization          = "Bearer $($env:GITHUB_TOKEN)"
              Accept                 = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Get-RunArtifacts {
              $artifacts = @()
              for ($page = 1; ; $page++) {
                  $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100&page=$page"
                  $response = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 60
                  $artifacts += @($response.artifacts)
                  if (@($response.artifacts).Count -lt 100) { return $artifacts }
              }
          }

          $pending = [System.Collections.Generic.List[int]]::new()
          2..$shardCount | ForEach-Object { $pending.Add($_) }
          $deadline = [DateTime]::UtcNow.AddMinutes($timeoutMinutes)
          $started = [DateTime]::UtcNow
          while ($pending.Count -gt 0) {
              try {
                  $artifacts = @(Get-RunArtifacts | Where-Object { -not $_.expired })
              } catch {
                  # Missing access does not heal by waiting; rate limits and server errors may.
                  $status = [int]($_.Exception.Response.StatusCode)
                  $rateLimited = $status -eq 429 -or ($status -eq 403 -and "$($_.ErrorDetails.Message)" -match 'rate limit')
                  if ($status -in 401, 403, 404 -and -not $rateLimited) {
                      throw "Listing run artifacts failed with HTTP ${status}; the job token needs actions: read. $($_.Exception.Message)"
                  }
                  Write-Warning "Listing run artifacts failed; retrying: $($_.Exception.Message)"
                  $artifacts = $null
              }

              foreach ($shard in @($pending)) {
                  if ($null -eq $artifacts) { break }
                  if ($artifacts | Where-Object { $_.name -ceq "$prefix-$shard-failed-$env:GITHUB_RUN_ATTEMPT" }) {
                      throw "API docs shard $shard failed; see the website-apidocs-shard ($shard) job."
                  }

                  $artifact = $artifacts | Where-Object { $_.name -ceq "$prefix-$shard" } |
                      Sort-Object -Property created_at -Descending | Select-Object -First 1
                  if (-not $artifact) { continue }

                  $target = Join-Path $destination $shard
                  $zip = Join-Path $destination "shard-$shard.zip"
                  try {
                      New-Item -ItemType Directory -Force -Path $target | Out-Null
                      # The redirect goes to signed storage; PowerShell does not forward the Authorization header.
                      Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)/zip" `
                          -Headers $headers -OutFile $zip -TimeoutSec 600
                      Expand-Archive -LiteralPath $zip -DestinationPath $target -Force
                      Remove-Item -LiteralPath $zip -Force
                  } catch {
                      # A rerun can replace an artifact while it downloads; list again and retry.
                      Write-Warning "Downloading API docs shard $shard failed; retrying: $($_.Exception.Message)"
                      Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
                      continue
                  }

                  $elapsed = [int]([DateTime]::UtcNow - $started).TotalSeconds
                  Write-Host ("Collected API docs shard {0} ({1:n1} MB) after waiting {2} s." -f $shard, ($artifact.size_in_bytes / 1MB), $elapsed)
                  [void]$pending.Remove($shard)
              }

              if ($pending.Count -eq 0) { break }
              if ([DateTime]::UtcNow -gt $deadline) {
                  throw "Timed out after $timeoutMinutes minute(s) waiting for API docs shard(s): $($pending -join ', ')."
              }
              Start-Sleep -Seconds 20
          }

      - name: Run website pipeline
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ (inputs.credential_mode == 'standard' || (inputs.credential_mode == 'public-github' && github.event.repository.private == false && github.event.repository.visibility == 'public')) && github.token || '' }}
          # Prevent an ambient runner CLI credential from overriding this policy.
          GH_TOKEN: ''
          GITHUB_PACKAGES_TOKEN: ${{ inputs.credential_mode == 'standard' && (secrets.repository_read_token || github.token) || '' }}
          LICENSING_PACKAGES_TOKEN: ${{ inputs.credential_mode == 'standard' && (secrets.repository_read_token || github.token) || '' }}
          LICENSING_PACKAGES_USERNAME: ${{ inputs.credential_mode == 'standard' && github.repository_owner || '' }}
          INDEXNOW_KEY: ${{ inputs.credential_mode == 'standard' && secrets.indexnow_key || '' }}
          POWERFORGE_REPOSITORY_TOKEN: ${{ inputs.credential_mode == 'standard' && secrets.repository_read_token || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.credential_mode == 'standard' && secrets.cloudflare_api_token || '' }}
          CLOUDFLARE_ZONE_ID: ${{ inputs.credential_mode == 'standard' && secrets.cloudflare_zone_id || '' }}
          POWERFORGE_DEPLOYMENT_MANIFEST: ${{ runner.temp }}/powerforge-deployment-manifest/manifest.json
          POWERFORGE_RUNNER_RESULT_PATH: ${{ runner.temp }}/powerforge-website-runner-result.json
          POWERFORGE_APIDOCS_SHARDS: ${{ inputs.apidocs_shards }}
        run: |
          $runnerRestoreConfig = Join-Path $env:GITHUB_WORKSPACE '.powerforge-runner/.github/nuget.public.config'
          if (-not (Test-Path -LiteralPath $runnerRestoreConfig -PathType Leaf)) {
            throw "PowerForge runner NuGet configuration not found: $runnerRestoreConfig"
          }

          $runnerArgs = @(
            'website-runner',
            '--website-root', '${{ inputs.website_root }}',
            '--pipeline-config', '${{ inputs.pipeline_config }}',
            '--engine-mode', '${{ inputs.engine_mode }}',
            '--pipeline-mode', '${{ inputs.pipeline_mode }}',
            '--powerforge-lock-path', '${{ inputs.powerforge_lock_path }}',
            '--powerforge-repository', '${{ inputs.powerforge_repository }}',
            '--powerforge-ref', '${{ startsWith(inputs.powerforge_ref, 'actions-') && steps.shared_runner.outputs.commit || inputs.powerforge_ref }}',
            '--powerforge-repository-override', '${{ inputs.powerforge_repository_override }}',
            '--powerforge-ref-override', '${{ inputs.powerforge_ref_override }}',
            '--powerforge-tool-lock-path', '${{ inputs.powerforge_tool_lock_path }}',
            '--powerforge-web-tag', '${{ inputs.powerforge_web_tag }}',
            '--result-path', $env:POWERFORGE_RUNNER_RESULT_PATH
          )

          if ('${{ inputs.maintenance_mode_note }}' -eq 'true') {
            $runnerArgs += '--maintenance-note'
          }

          if ([int]$env:POWERFORGE_APIDOCS_SHARDS -gt 1) {
            # Merges every shard archive, then runs the steps after the apidocs block.
            $runnerArgs += @('--split-phase', 'finish', '--split-archives', (Join-Path $env:RUNNER_TEMP 'powerforge-apidocs-shards'))
          }

          dotnet run --framework net10.0 -p:RestoreLockedMode=false "-p:RestoreConfigFile=$runnerRestoreConfig" --project ./.powerforge-runner/PowerForge.Web.Cli/PowerForge.Web.Cli.csproj -- $runnerArgs

      - name: Resolve actual PowerForge engine provenance
        id: engine_provenance
        shell: pwsh
        env:
          POWERFORGE_RUNNER_RESULT_PATH: ${{ runner.temp }}/powerforge-website-runner-result.json
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:POWERFORGE_RUNNER_RESULT_PATH -PathType Leaf)) {
            throw "Website runner result not found: $($env:POWERFORGE_RUNNER_RESULT_PATH)"
          }
          $result = Get-Content -LiteralPath $env:POWERFORGE_RUNNER_RESULT_PATH -Raw | ConvertFrom-Json
          $mode = [string]$result.engineMode
          $repository = [string]$result.repository
          if ($mode -notin @('source', 'binary')) {
            throw "Website runner returned unsupported engine mode '$mode'."
          }
          if ($repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw "Website runner returned invalid engine repository '$repository'."
          }

          $ref = ''
          $sha = ''
          $asset = ''
          $assetSha256 = ''
          if ($mode -eq 'source') {
            $ref = [string]$result.ref
            if ($ref -notmatch '^[0-9a-fA-F]{40,64}$') {
              throw "Website runner returned invalid source engine commit '$ref'."
            }
            $ref = $ref.ToLowerInvariant()
            $sha = $ref
          } else {
            $ref = [string]$result.tag
            $asset = [string]$result.asset
            $assetSha256 = [string]$result.assetSha256
            if ([string]::IsNullOrWhiteSpace($ref) -or [string]::IsNullOrWhiteSpace($asset)) {
              throw 'Website runner did not report the binary release tag and asset.'
            }
            if ($assetSha256 -notmatch '^[0-9a-f]{64}$') {
              throw "Website runner returned invalid binary asset SHA-256 '$assetSha256'."
            }
          }

          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "repository=$repository" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_sha256=$assetSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload website reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: ${{ inputs.report_artifact_name }}
          path: |
            ${{ inputs.website_root == '.' && '_reports/**' || format('{0}/_reports/**', inputs.website_root) }}
            ${{ inputs.website_root == '.' && '_site/_reports/**' || format('{0}/_site/_reports/**', inputs.website_root) }}
            ${{ inputs.website_root == '.' && '_temp/pipeline-profile.json' || format('{0}/_temp/pipeline-profile.json', inputs.website_root) }}
          if-no-files-found: ignore

      - name: Cleanup transient tool caches before site artifact
        if: ${{ inputs.upload_pages_artifact || inputs.validate_pages_artifact || inputs.site_artifact_name != '' || inputs.generate_cloudflare_cache_manifest || inputs.generate_deployment_manifest }}
        shell: pwsh
        run: |
          $cacheRoot = [System.IO.Path]::GetFullPath($env:POWERFORGE_RUNNER_CACHE_ROOT)
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)
          $workspacePrefix = $workspace + [System.IO.Path]::DirectorySeparatorChar
          if ($cacheRoot.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase) -and (Test-Path -LiteralPath $cacheRoot)) {
            Remove-Item -LiteralPath $cacheRoot -Recurse -Force
          }

      - name: Archive site artifact
        if: ${{ (inputs.upload_pages_artifact || inputs.validate_pages_artifact || inputs.site_artifact_name != '' || inputs.generate_cloudflare_cache_manifest || inputs.generate_deployment_manifest) && runner.os == 'Linux' }}
        shell: sh
        env:
          SITE_ARTIFACT_PATH: ${{ inputs.site_artifact_path || inputs.pages_artifact_path || format('./{0}/_site', inputs.website_root) }}
        run: |
          echo "::group::Archive site artifact"
          tar \
            --dereference --hard-dereference \
            --directory "$SITE_ARTIFACT_PATH" \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          echo "::endgroup::"

      - name: Archive site artifact
        if: ${{ (inputs.upload_pages_artifact || inputs.validate_pages_artifact || inputs.site_artifact_name != '' || inputs.generate_cloudflare_cache_manifest || inputs.generate_deployment_manifest) && runner.os == 'macOS' }}
        shell: sh
        env:
          SITE_ARTIFACT_PATH: ${{ inputs.site_artifact_path || inputs.pages_artifact_path || format('./{0}/_site', inputs.website_root) }}
        run: |
          echo "::group::Archive site artifact"
          gtar \
            --dereference --hard-dereference \
            --directory "$SITE_ARTIFACT_PATH" \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          echo "::endgroup::"

      - name: Archive site artifact
        if: ${{ (inputs.upload_pages_artifact || inputs.validate_pages_artifact || inputs.site_artifact_name != '' || inputs.generate_cloudflare_cache_manifest || inputs.generate_deployment_manifest) && runner.os == 'Windows' }}
        shell: pwsh
        env:
          SITE_ARTIFACT_PATH: ${{ inputs.site_artifact_path || inputs.pages_artifact_path || format('./{0}/_site', inputs.website_root) }}
        run: |
          Write-Host "::group::Archive site artifact"
          $resolvedArtifactPath = [System.IO.Path]::GetFullPath($env:SITE_ARTIFACT_PATH)
          if (-not (Test-Path -LiteralPath $resolvedArtifactPath)) {
            throw "Site artifact path not found: $resolvedArtifactPath"
          }

          $tempRoot = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          $freeBytes = ([System.IO.DriveInfo]::new($tempRoot)).AvailableFreeSpace
          $sourceBytes = (Get-ChildItem -LiteralPath $resolvedArtifactPath -Recurse -Force -File | Measure-Object -Property Length -Sum).Sum
          $requiredBytes = [Math]::Max(1GB, [int64]($sourceBytes * 1.1))
          Write-Host ("Site artifact source: {0:n0} bytes; runner temp free: {1:n0} bytes; required estimate: {2:n0} bytes" -f $sourceBytes, $freeBytes, $requiredBytes)
          if ($freeBytes -lt $requiredBytes) {
            throw "Not enough free space on $tempRoot to archive Pages artifact. Free $freeBytes bytes, estimated need $requiredBytes bytes for $resolvedArtifactPath."
          }

          $tarArgs = @(
            '--dereference',
            '--directory',
            $resolvedArtifactPath,
            '-cf',
            (Join-Path $env:RUNNER_TEMP 'artifact.tar'),
            '--exclude=.git',
            '--exclude=.github',
            '.'
          )
          tar @tarArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Write-Host "::endgroup::"

      - name: Detect incremental Cloudflare purge
        if: ${{ inputs.generate_cloudflare_cache_manifest }}
        id: cloudflare_incremental
        shell: pwsh
        env:
          POWERFORGE_CLOUDFLARE_CLI_PROJECT: ${{ github.workspace }}/.powerforge-runner/PowerForge.Web.Cli/PowerForge.Web.Cli.csproj
          POWERFORGE_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          POWERFORGE_SITE_CONFIG: ${{ format('./{0}/site.json', inputs.website_root) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $workspacePrefix = $workspace + [IO.Path]::DirectorySeparatorChar
          $siteConfig = [IO.Path]::GetFullPath((Join-Path $workspace $env:POWERFORGE_SITE_CONFIG))
          if (-not $siteConfig.StartsWith($workspacePrefix, [StringComparison]::Ordinal) -or
              -not (Test-Path -LiteralPath $siteConfig -PathType Leaf)) {
            throw 'Site configuration must identify a file inside the caller repository.'
          }

          $jsonOutput = @(dotnet run --no-build --no-restore --framework net10.0 --project $env:POWERFORGE_CLOUDFLARE_CLI_PROJECT -- cloudflare inspect --site-config $siteConfig --output json)
          if ($LASTEXITCODE -ne 0) {
            throw "Resolving the inherited Cloudflare site profile failed with exit code $LASTEXITCODE."
          }
          try {
            $profile = ($jsonOutput -join [Environment]::NewLine) | ConvertFrom-Json
            if ($profile.success -ne $true -or [string]::IsNullOrWhiteSpace([string]$profile.result.purgeMode)) {
              throw 'The Cloudflare profile result did not contain purgeMode.'
            }
          } catch {
            throw "Resolving the inherited Cloudflare site profile returned invalid JSON: $($_.Exception.Message)"
          }
          $enabled = ([string]$profile.result.purgeMode -ceq 'incremental')
          $relativeConfig = [IO.Path]::GetRelativePath($workspace, $siteConfig).Replace([IO.Path]::DirectorySeparatorChar, '/')
          $scopeBytes = [Text.Encoding]::UTF8.GetBytes("$($env:POWERFORGE_GITHUB_REPOSITORY_ID)|$relativeConfig")
          $scope = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($scopeBytes)).ToLowerInvariant()
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "scope=$scope" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare exact deployment manifest
        if: ${{ inputs.generate_deployment_manifest || steps.cloudflare_incremental.outputs.enabled == 'true' }}
        id: deployment_manifest
        shell: pwsh
        run: |
          "artifact_name=powerforge-deployment-manifest-$([Guid]::NewGuid().ToString('N'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create exact deployment manifest
        if: ${{ steps.deployment_manifest.outputs.artifact_name != '' }}
        shell: pwsh
        env:
          POWERFORGE_SITE_CONFIG: ${{ format('./{0}/site.json', inputs.website_root) }}
          POWERFORGE_SITE_ARTIFACT: ${{ runner.temp }}/artifact.tar
          POWERFORGE_DEPLOYMENT_MANIFEST: ${{ runner.temp }}/powerforge-deployment-manifest/manifest.json
        run: |
          dotnet run --no-restore --framework net10.0 --project ./.powerforge-runner/PowerForge.Web.Cli/PowerForge.Web.Cli.csproj -- cloudflare manifest create --site-config $env:POWERFORGE_SITE_CONFIG --artifact $env:POWERFORGE_SITE_ARTIFACT --out $env:POWERFORGE_DEPLOYMENT_MANIFEST
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the exact deployment manifest failed with exit code $LASTEXITCODE."
          }

      - name: Upload exact deployment manifest
        if: ${{ steps.deployment_manifest.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.deployment_manifest.outputs.artifact_name }}
          path: ${{ runner.temp }}/powerforge-deployment-manifest/manifest.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload Pages artifact
        if: ${{ inputs.upload_pages_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload site artifact
        if: ${{ inputs.site_artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.site_artifact_name }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: ${{ inputs.site_artifact_retention_days }}
          if-no-files-found: error


      - name: Save validated NuGet cache
        uses: ./.powerforge-cache-policy/.github/actions/cache-nuget
        with:
          mode: save
          key: ${{ steps.nuget-cache.outputs.primary-key }}
          cache-hit: ${{ steps.nuget-cache.outputs.cache-hit }}

      - name: Save npm cache
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.npm-cache.outputs.cache-primary-key != '' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Cleanup transient tool caches
        if: ${{ always() }}
        shell: pwsh
        run: |
          $cacheRoot = [System.IO.Path]::GetFullPath($env:POWERFORGE_RUNNER_CACHE_ROOT)
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)
          $workspacePrefix = $workspace + [System.IO.Path]::DirectorySeparatorChar
          if ($cacheRoot.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase) -and (Test-Path -LiteralPath $cacheRoot)) {
            Remove-Item -LiteralPath $cacheRoot -Recurse -Force
          }

  # Extra machines for the apidocs block. Each runs the steps before the block and its share of the
  # API docs, then uploads the files that share produced; website-run waits for them and merges.
  website-apidocs-shard:
    if: ${{ inputs.apidocs_shards > 1 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson('[[0],[0],[2],[2,3],[2,3,4],[2,3,4,5],[2,3,4,5,6],[2,3,4,5,6,7],[2,3,4,5,6,7,8]]')[inputs.apidocs_shards] }}
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      POWERFORGE_RUNNER_CACHE_ROOT: ${{ github.workspace }}/.cache/powerforge-runner
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/powerforge-runner/ms-playwright
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: ${{ github.workspace }}/.cache/powerforge-runner/dotnet-bundle
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/powerforge-runner/bun-install-cache
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/powerforge-runner/npm-cache
    steps:
      - name: Validate credential mode
        shell: pwsh
        env:
          POWERFORGE_CREDENTIAL_MODE: ${{ inputs.credential_mode }}
          POWERFORGE_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && github.event.repository.visibility == 'public' }}
        run: |
          if ($env:POWERFORGE_CREDENTIAL_MODE -notin @('none', 'standard', 'public-github')) {
            throw "Unsupported credential_mode '$env:POWERFORGE_CREDENTIAL_MODE'. Expected none, standard or public-github."
          }
          if ($env:POWERFORGE_CREDENTIAL_MODE -eq 'public-github' -and $env:POWERFORGE_PUBLIC_REPOSITORY -ne 'true') {
            throw 'public-github credentials require a verified public repository.'
          }

      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}
          persist-credentials: false
          # workflow_call can otherwise default to refs/pull/<n>/merge, which is not available in some repos.
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Resolve website source provenance
        id: source_provenance
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sourceSha -notmatch '^[a-f0-9]{40,64}$') {
            throw "Unable to resolve the exact website source commit."
          }

          "sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve shared workflow source
        id: workflow_source
        shell: pwsh
        run: |
          $resolvedRepository = [string]'${{ inputs.powerforge_repository }}'
          $resolvedRef = [string]'${{ inputs.powerforge_ref }}'
          $workflowRepository = [string]'${{ job.workflow_repository }}'
          $workflowRef = [string]'${{ job.workflow_ref }}'
          $workflowSha = [string]'${{ job.workflow_sha }}'

          if ([string]::IsNullOrWhiteSpace($resolvedRepository)) {
            $resolvedRepository = $workflowRepository
          }

          if ([string]::IsNullOrWhiteSpace($resolvedRepository)) {
            $resolvedRepository = 'EvotecIT/PSPublishModule'
          }

          if ([string]::IsNullOrWhiteSpace($resolvedRef)) {
            $resolvedRef = $workflowSha
          }

          if ([string]::IsNullOrWhiteSpace($resolvedRef)) {
            throw "Unable to resolve the shared workflow commit SHA from job.workflow_sha. Pass powerforge_ref explicitly."
          }

          Write-Host "Resolved shared workflow source from $workflowRef to $resolvedRepository@$resolvedRef"
          "repository=$resolvedRepository" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ref=$resolvedRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout shared PowerForge runner
        id: shared_runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.workflow_source.outputs.repository }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: ./.powerforge-runner
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout shared cache policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ./.powerforge-cache-policy
          sparse-checkout: .github/actions/cache-nuget
          persist-credentials: false
          fetch-depth: 1

      - name: Setup .NET
        uses: ./.powerforge-runner/.github/actions/setup-dotnet
        with:
          global-json-file: ${{ hashFiles('global.json') != '' && 'global.json' || '.powerforge-runner/global.json' }}
      - name: Select hosted npm cache directory
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          "NPM_CONFIG_CACHE=$(Join-Path $env:RUNNER_TEMP 'powerforge-npm-cache')" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        id: nuget-cache
        uses: ./.powerforge-cache-policy/.github/actions/cache-nuget

      - name: Restore npm cache
        id: npm-cache
        if: runner.environment == 'github-hosted' && hashFiles('**/package-lock.json', '!**/node_modules/**', '!**/obj/**', '!**/bin/**') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: powerforge-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '!**/node_modules/**', '!**/obj/**', '!**/bin/**') }}
          restore-keys: |
            powerforge-npm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare social card renderer
        shell: pwsh
        env:
          POWERFORGE_SOCIAL_CARDS: ${{ inputs.social-cards }}
          POWERFORGE_PIPELINE_CONFIG: ${{ inputs.pipeline_config }}
          POWERFORGE_PIPELINE_MODE: ${{ inputs.pipeline_mode }}
          POWERFORGE_WEBSITE_ROOT: ${{ inputs.website_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $selection = $env:POWERFORGE_SOCIAL_CARDS.ToLowerInvariant()
          if ($selection -notin @('auto', 'true', 'false')) {
            throw 'social-cards must be auto, true or false.'
          }
          $enabled = $selection -eq 'true'
          if ($selection -eq 'auto') {
            $restoreConfig = Join-Path $env:GITHUB_WORKSPACE '.powerforge-runner/.github/nuget.public.config'
            $output = @(dotnet run --framework net10.0 -p:RestoreLockedMode=false "-p:RestoreConfigFile=$restoreConfig" --project ./.powerforge-runner/PowerForge.Web.Cli/PowerForge.Web.Cli.csproj -- website-runner --website-root $env:POWERFORGE_WEBSITE_ROOT --pipeline-config $env:POWERFORGE_PIPELINE_CONFIG --pipeline-mode $env:POWERFORGE_PIPELINE_MODE --check-social-cards)
            if ($LASTEXITCODE -ne 0 -or $output.Count -eq 0 -or $output[-1] -notin @('true', 'false')) {
              throw 'Unable to determine social card requirements from the website pipeline.'
            }
            $enabled = $output[-1] -eq 'true'
          }
          & ./.powerforge-runner/.github/scripts/Install-WebsiteSocialCardDependencies.ps1 -Enabled $enabled

      - name: Install requested .NET workloads
        if: ${{ inputs.dotnet_workloads != '' }}
        shell: pwsh
        env:
          DOTNET_WORKLOADS: ${{ inputs.dotnet_workloads }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workloads = @(
            $env:DOTNET_WORKLOADS -split '[,;\s]+' |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique
          )

          if ($workloads.Count -eq 0) {
            throw 'dotnet_workloads did not contain a workload identifier.'
          }

          foreach ($workload in $workloads) {
            if ($workload -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
              throw "Invalid .NET workload identifier '$workload'."
            }
          }

          dotnet workload install @workloads --skip-manifest-update
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet workload install failed with exit code $LASTEXITCODE."
          }

      - name: Initialize transient tool cache directories
        shell: pwsh
        run: |
          foreach ($path in @(
            $env:POWERFORGE_RUNNER_CACHE_ROOT,
            $env:NUGET_PACKAGES,
            $env:PLAYWRIGHT_BROWSERS_PATH,
            $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR,
            $env:BUN_INSTALL_CACHE_DIR,
            $env:NPM_CONFIG_CACHE
          )) {
            if (-not [string]::IsNullOrWhiteSpace($path)) {
              New-Item -ItemType Directory -Force -Path $path | Out-Null
            }
          }

      - name: Run website pipeline shard
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ (inputs.credential_mode == 'standard' || (inputs.credential_mode == 'public-github' && github.event.repository.private == false && github.event.repository.visibility == 'public')) && github.token || '' }}
          # Prevent an ambient runner CLI credential from overriding this policy.
          GH_TOKEN: ''
          GITHUB_PACKAGES_TOKEN: ${{ inputs.credential_mode == 'standard' && (secrets.repository_read_token || github.token) || '' }}
          LICENSING_PACKAGES_TOKEN: ${{ inputs.credential_mode == 'standard' && (secrets.repository_read_token || github.token) || '' }}
          LICENSING_PACKAGES_USERNAME: ${{ inputs.credential_mode == 'standard' && github.repository_owner || '' }}
          INDEXNOW_KEY: ${{ inputs.credential_mode == 'standard' && secrets.indexnow_key || '' }}
          POWERFORGE_REPOSITORY_TOKEN: ${{ inputs.credential_mode == 'standard' && secrets.repository_read_token || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.credential_mode == 'standard' && secrets.cloudflare_api_token || '' }}
          CLOUDFLARE_ZONE_ID: ${{ inputs.credential_mode == 'standard' && secrets.cloudflare_zone_id || '' }}
          POWERFORGE_RUNNER_RESULT_PATH: ${{ runner.temp }}/powerforge-website-runner-result.json
          POWERFORGE_APIDOCS_SHARD: ${{ matrix.shard }}/${{ inputs.apidocs_shards }}
        run: |
          $runnerRestoreConfig = Join-Path $env:GITHUB_WORKSPACE '.powerforge-runner/.github/nuget.public.config'
          if (-not (Test-Path -LiteralPath $runnerRestoreConfig -PathType Leaf)) {
            throw "PowerForge runner NuGet configuration not found: $runnerRestoreConfig"
          }

          $runnerArgs = @(
            'website-runner',
            '--website-root', '${{ inputs.website_root }}',
            '--pipeline-config', '${{ inputs.pipeline_config }}',
            '--engine-mode', '${{ inputs.engine_mode }}',
            '--pipeline-mode', '${{ inputs.pipeline_mode }}',
            '--powerforge-lock-path', '${{ inputs.powerforge_lock_path }}',
            '--powerforge-repository', '${{ inputs.powerforge_repository }}',
            '--powerforge-ref', '${{ startsWith(inputs.powerforge_ref, 'actions-') && steps.shared_runner.outputs.commit || inputs.powerforge_ref }}',
            '--powerforge-repository-override', '${{ inputs.powerforge_repository_override }}',
            '--powerforge-ref-override', '${{ inputs.powerforge_ref_override }}',
            '--powerforge-tool-lock-path', '${{ inputs.powerforge_tool_lock_path }}',
            '--powerforge-web-tag', '${{ inputs.powerforge_web_tag }}',
            '--result-path', $env:POWERFORGE_RUNNER_RESULT_PATH
          )

          $runnerArgs += @('--split-phase', 'prepare', '--apidocs-shard', $env:POWERFORGE_APIDOCS_SHARD,
            '--split-archive', (Join-Path $env:RUNNER_TEMP 'powerforge-apidocs-shard/shard.tar'))

          dotnet run --framework net10.0 -p:RestoreLockedMode=false "-p:RestoreConfigFile=$runnerRestoreConfig" --project ./.powerforge-runner/PowerForge.Web.Cli/PowerForge.Web.Cli.csproj -- $runnerArgs

      - name: Upload API docs shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.report_artifact_name }}-apidocs-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/powerforge-apidocs-shard/shard.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Record failed API docs shard
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'powerforge-apidocs-shard-failed.txt'
          "API docs shard ${{ matrix.shard }} failed in attempt ${{ github.run_attempt }}." | Set-Content -LiteralPath $marker

      - name: Upload failed API docs shard marker
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.report_artifact_name }}-apidocs-shard-${{ matrix.shard }}-failed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/powerforge-apidocs-shard-failed.txt
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Upload API docs shard reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: ${{ inputs.report_artifact_name }}-apidocs-shard-${{ matrix.shard }}-reports
          overwrite: true
          path: |
            ${{ inputs.website_root == '.' && '_temp/pipeline-profile.json' || format('{0}/_temp/pipeline-profile.json', inputs.website_root) }}
          if-no-files-found: ignore

      - name: Cleanup transient tool caches
        if: ${{ always() }}
        shell: pwsh
        run: |
          $cacheRoot = [System.IO.Path]::GetFullPath($env:POWERFORGE_RUNNER_CACHE_ROOT)
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)
          $workspacePrefix = $workspace + [System.IO.Path]::DirectorySeparatorChar
          if ($cacheRoot.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase) -and (Test-Path -LiteralPath $cacheRoot)) {
            Remove-Item -LiteralPath $cacheRoot -Recurse -Force
          }
