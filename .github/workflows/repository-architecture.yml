name: Repository Architecture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve impact refs
        id: refs
        shell: pwsh
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          $baseRef = [string]$env:EVENT_BASE_SHA
          $headRef = [string]$env:EVENT_HEAD_SHA
          if ([string]::IsNullOrWhiteSpace($baseRef) -and -not [string]::IsNullOrWhiteSpace($env:EVENT_BEFORE_SHA) -and $env:EVENT_BEFORE_SHA -notmatch '^0+$') {
            $baseRef = $env:EVENT_BEFORE_SHA
            $headRef = $env:EVENT_SHA
          }
          "base-ref=$baseRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head-ref=$headRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify repository architecture
        id: architecture
        uses: ./.github/actions/repository-architecture
        with:
          source-root: ${{ github.workspace }}
          repository-root: ${{ github.workspace }}
          config-path: .powerforge/architecture.json
          base-ref: ${{ steps.refs.outputs.base-ref }}
          head-ref: ${{ steps.refs.outputs.head-ref }}

      - name: Upload architecture reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powerforge-architecture-reports
          path: |
            ${{ steps.architecture.outputs.report-json }}
            ${{ steps.architecture.outputs.summary-markdown }}
          if-no-files-found: ignore
