name: PowerForge .NET Tests

on:
  workflow_call:
    inputs:
      config_path:
        description: Declarative PowerForge .NET test profiles, relative to the repository.
        type: string
        required: true
      profile:
        description: Profile name; a matrix profile overrides it.
        type: string
        default: test
      matrix_json:
        description: OS/framework matrix, with optional runtime and profile for native smoke tests.
        type: string
        default: '{"include":[{"os":"windows-latest","framework":"net472"},{"os":"windows-latest","framework":"net8.0"},{"os":"ubuntu-latest","framework":"net8.0"}]}'
      dotnet_version:
        description: Additional SDK versions; engine and consumer global.json files are also honored.
        type: string
        default: ''
      result_artifact_name:
        type: string
        default: dotnet-test-results
      timeout_minutes:
        type: number
        default: 30

permissions:
  contents: read

jobs:
  test:
    name: .NET (${{ matrix.os }}, ${{ matrix.framework }}, ${{ matrix.profile || inputs.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix_json) }}
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout shared test runner
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .powerforge-module-test
          persist-credentials: false
      - name: Setup shared test runner
        uses: ./.powerforge-module-test/.github/actions/setup-test-runner
        with:
          dotnet_version: ${{ inputs.dotnet_version }}
      - name: Run .NET tests and probes
        shell: pwsh
        env:
          DOTNET_TEST_CONFIG: ${{ inputs.config_path }}
          DOTNET_TEST_PROFILE: ${{ matrix.profile || inputs.profile }}
          DOTNET_TEST_FRAMEWORK: ${{ matrix.framework }}
          DOTNET_TEST_RUNTIME: ${{ matrix.runtime }}
        run: ./.powerforge-module-test/.github/scripts/Invoke-DotNetTestCI.ps1
      - name: Publish job summary
        if: always()
        shell: pwsh
        run: |
          $summary = Join-Path $env:RUNNER_TEMP 'powerforge-dotnet-test-results/summary.md'
          if (Test-Path -LiteralPath $summary) {
            Get-Content -LiteralPath $summary -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            'Setup failed before .NET tests produced a summary. Check the job log.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.result_artifact_name }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/powerforge-dotnet-test-results/**/*.trx
            ${{ runner.temp }}/powerforge-dotnet-test-results/summary.md
          if-no-files-found: warn
          retention-days: 7
      - name: Remove staged SDK setup
        if: always()
        shell: pwsh
        run: |
          $stage = './.powerforge-module-test/.github/actions/setup-dotnet/Stage-SetupDotNet.ps1'
          if (Test-Path -LiteralPath $stage) { & $stage -Remove }
