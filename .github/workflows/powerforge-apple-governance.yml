name: PowerForge Apple Governance

on:
  workflow_call:
    inputs:
      operation:
        description: Plan or Apply the reviewed Apple governance declaration.
        required: true
        type: string
      source_ref:
        description: Exact consumer source commit containing the declaration.
        required: true
        type: string
      config_path:
        description: Governance declaration path relative to the consumer source.
        required: false
        default: .powerforge/apple/governance.json
        type: string
      release_config_path:
        description: Optional release configuration path relative to the consumer source.
        required: false
        default: ""
        type: string
      powerforge_ref:
        description: Exact PSPublishModule commit containing the governance engine and action.
        required: true
        type: string
      runner_labels_json:
        description: JSON array of trusted Apple runner labels.
        required: false
        default: '["self-hosted","macOS","ARM64"]'
        type: string
      tool_runtime:
        description: Runtime identifier for the trusted Apple runner.
        required: false
        default: osx-arm64
        type: string
      environment_name:
        description: GitHub environment exposing read-only planning credentials.
        required: false
        default: apple-release
        type: string
      approval_environment_name:
        description: Protected GitHub environment required for Apply.
        required: false
        default: apple-release-approval
        type: string
      allowed_dispatchers_json:
        description: Optional JSON array of GitHub logins allowed to request Apply; protected environment review remains enforced.
        required: false
        default: '[]'
        type: string
      maximum_changes:
        description: Maximum mutations allowed in one confirmed Apply.
        required: false
        default: 500
        type: number
    secrets:
      caller_app_store_connect_issuer_id:
        required: false
      caller_app_store_connect_key_id:
        required: false
      caller_app_store_connect_private_key:
        required: false

concurrency:
  group: powerforge-apple-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: 45
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
    steps:
      - name: Validate immutable inputs and authorization
        shell: pwsh
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_REF: ${{ inputs.source_ref }}
          POWERFORGE_REF: ${{ inputs.powerforge_ref }}
          DISPATCHERS_JSON: ${{ inputs.allowed_dispatchers_json }}
          DISPATCHER: ${{ github.triggering_actor }}
          ORIGINAL_DISPATCHER: ${{ github.actor }}
          MAXIMUM_CHANGES: ${{ inputs.maximum_changes }}
        run: |
          if ($env:OPERATION -notin @('Plan', 'Apply')) { throw 'operation must be Plan or Apply.' }
          foreach ($entry in @{ source_ref = $env:SOURCE_REF; powerforge_ref = $env:POWERFORGE_REF }.GetEnumerator()) {
            if ($entry.Value -notmatch '^[0-9A-Fa-f]{40}$') { throw "$($entry.Key) must be an exact 40-character commit SHA." }
          }
          $maximumChanges = 0
          if (-not [int]::TryParse($env:MAXIMUM_CHANGES, [ref] $maximumChanges) -or $maximumChanges -lt 1 -or $maximumChanges -gt 1000) {
            throw 'maximum_changes must be between 1 and 1000.'
          }
          if ($env:OPERATION -eq 'Apply') {
            $dispatchers = @($env:DISPATCHERS_JSON | ConvertFrom-Json -Depth 5)
            if ($dispatchers.Count -gt 0 -and $env:DISPATCHER -notin $dispatchers) {
              throw "GitHub triggering actor '$($env:DISPATCHER)' is not an authorized Apple governance dispatcher."
            }
            Write-Host "Authorized triggering actor '$($env:DISPATCHER)' (original run actor '$($env:ORIGINAL_DISPATCHER)')."
          }

      - name: Checkout exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Checkout exact shared governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: EvotecIT/PSPublishModule
          ref: ${{ inputs.powerforge_ref }}
          fetch-depth: 1
          path: powerforge-shared
          persist-credentials: false

      - name: Verify exact checked-out commits and declaration paths
        id: paths
        shell: pwsh
        env:
          EXPECTED_SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_POWERFORGE_REF: ${{ inputs.powerforge_ref }}
          CONFIG_PATH: ${{ inputs.config_path }}
          RELEASE_CONFIG_PATH: ${{ inputs.release_config_path }}
        run: |
          $source = (git -C source rev-parse HEAD).Trim()
          $shared = (git -C powerforge-shared rev-parse HEAD).Trim()
          if ($source -ine $env:EXPECTED_SOURCE_REF) { throw "Expected source '$($env:EXPECTED_SOURCE_REF)', received '$source'." }
          if ($shared -ine $env:EXPECTED_POWERFORGE_REF) { throw "Expected shared '$($env:EXPECTED_POWERFORGE_REF)', received '$shared'." }

          $sourceRoot = [IO.Path]::GetFullPath('${{ github.workspace }}/source').TrimEnd([IO.Path]::DirectorySeparatorChar)
          function Resolve-TrackedSourceFile([string] $relativePath, [string] $name, [bool] $required) {
            if ([string]::IsNullOrWhiteSpace($relativePath)) {
              if ($required) { throw "$name is required." }
              return ''
            }
            if ([IO.Path]::IsPathRooted($relativePath)) { throw "$name must be relative to the checked-out source." }
            $fullPath = [IO.Path]::GetFullPath((Join-Path $sourceRoot $relativePath))
            $prefix = $sourceRoot + [IO.Path]::DirectorySeparatorChar
            if (-not $fullPath.StartsWith($prefix, [StringComparison]::Ordinal)) { throw "$name must resolve to a child of the checked-out source." }
            $current = $fullPath
            while ($current -ne $sourceRoot) {
              if (Test-Path -LiteralPath $current) {
                $item = Get-Item -LiteralPath $current -Force
                if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "$name must not traverse a symbolic link or reparse point: $current" }
              }
              $current = Split-Path -Parent $current
            }
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) { throw "$name was not found: $relativePath" }
            $normalized = [IO.Path]::GetRelativePath($sourceRoot, $fullPath).Replace('\', '/')
            & git -C $sourceRoot ls-files --error-unmatch -- $normalized *> $null
            if ($LASTEXITCODE -ne 0) { throw "$name must be tracked at the exact source commit: $normalized" }
            & git -C $sourceRoot diff --quiet -- $normalized
            if ($LASTEXITCODE -ne 0) { throw "$name differs from the exact source commit: $normalized" }
            return $fullPath
          }

          $governancePath = Resolve-TrackedSourceFile $env:CONFIG_PATH 'config_path' $true
          $releasePath = Resolve-TrackedSourceFile $env:RELEASE_CONFIG_PATH 'release_config_path' $false
          "governance-path=$governancePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release-path=$releasePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build exact PowerForge source
        id: build-powerforge
        uses: ./powerforge-shared/.github/actions/build-powerforge
        with:
          source-root: ${{ github.workspace }}/powerforge-shared
          runtime: ${{ inputs.tool_runtime }}

      - name: Validate governance declaration offline
        uses: ./powerforge-shared/.github/actions/apple-governance
        with:
          operation: Validate
          config-path: ${{ steps.paths.outputs.governance-path }}
          tool-path: ${{ steps.build-powerforge.outputs.tool-path }}

      - name: Plan Apple governance drift
        id: governance_plan
        uses: ./powerforge-shared/.github/actions/apple-governance
        with:
          operation: Plan
          config-path: ${{ steps.paths.outputs.governance-path }}
          release-config-path: ${{ steps.paths.outputs.release-path }}
          receipt-path: ${{ runner.temp }}/powerforge-apple-governance-plan.json
          tool-path: ${{ steps.build-powerforge.outputs.tool-path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.caller_app_store_connect_issuer_id }}
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.caller_app_store_connect_key_id }}
          private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.caller_app_store_connect_private_key }}

      - name: Upload governance plan for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powerforge-apple-governance-${{ inputs.source_ref }}-plan
          path: ${{ steps.governance_plan.outputs.receipt-path }}
          if-no-files-found: error
          retention-days: 90

  apply:
    if: inputs.operation == 'Apply'
    needs: plan
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: 45
    environment: ${{ inputs.approval_environment_name }}
    permissions:
      contents: read
    steps:
      - name: Revalidate authorized dispatcher
        shell: pwsh
        env:
          DISPATCHERS_JSON: ${{ inputs.allowed_dispatchers_json }}
          DISPATCHER: ${{ github.triggering_actor }}
          ORIGINAL_DISPATCHER: ${{ github.actor }}
        run: |
          $dispatchers = @($env:DISPATCHERS_JSON | ConvertFrom-Json -Depth 5)
          if ($dispatchers.Count -gt 0 -and $env:DISPATCHER -notin $dispatchers) {
            throw "GitHub triggering actor '$($env:DISPATCHER)' is not an authorized Apple governance dispatcher."
          }
          Write-Host "Authorized triggering actor '$($env:DISPATCHER)' (original run actor '$($env:ORIGINAL_DISPATCHER)')."

      - name: Checkout exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Checkout exact shared governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: EvotecIT/PSPublishModule
          ref: ${{ inputs.powerforge_ref }}
          fetch-depth: 1
          path: powerforge-shared
          persist-credentials: false

      - name: Reverify exact commits and declaration paths
        id: paths
        shell: pwsh
        env:
          EXPECTED_SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_POWERFORGE_REF: ${{ inputs.powerforge_ref }}
          CONFIG_PATH: ${{ inputs.config_path }}
          RELEASE_CONFIG_PATH: ${{ inputs.release_config_path }}
        run: |
          $source = (git -C source rev-parse HEAD).Trim()
          $shared = (git -C powerforge-shared rev-parse HEAD).Trim()
          if ($source -ine $env:EXPECTED_SOURCE_REF) { throw "Expected source '$($env:EXPECTED_SOURCE_REF)', received '$source'." }
          if ($shared -ine $env:EXPECTED_POWERFORGE_REF) { throw "Expected shared '$($env:EXPECTED_POWERFORGE_REF)', received '$shared'." }

          $sourceRoot = [IO.Path]::GetFullPath('${{ github.workspace }}/source').TrimEnd([IO.Path]::DirectorySeparatorChar)
          function Resolve-TrackedSourceFile([string] $relativePath, [string] $name, [bool] $required) {
            if ([string]::IsNullOrWhiteSpace($relativePath)) {
              if ($required) { throw "$name is required." }
              return ''
            }
            if ([IO.Path]::IsPathRooted($relativePath)) { throw "$name must be relative to the checked-out source." }
            $fullPath = [IO.Path]::GetFullPath((Join-Path $sourceRoot $relativePath))
            $prefix = $sourceRoot + [IO.Path]::DirectorySeparatorChar
            if (-not $fullPath.StartsWith($prefix, [StringComparison]::Ordinal)) { throw "$name must resolve to a child of the checked-out source." }
            $current = $fullPath
            while ($current -ne $sourceRoot) {
              if (Test-Path -LiteralPath $current) {
                $item = Get-Item -LiteralPath $current -Force
                if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "$name must not traverse a symbolic link or reparse point: $current" }
              }
              $current = Split-Path -Parent $current
            }
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) { throw "$name was not found: $relativePath" }
            $normalized = [IO.Path]::GetRelativePath($sourceRoot, $fullPath).Replace('\', '/')
            & git -C $sourceRoot ls-files --error-unmatch -- $normalized *> $null
            if ($LASTEXITCODE -ne 0) { throw "$name must be tracked at the exact source commit: $normalized" }
            & git -C $sourceRoot diff --quiet -- $normalized
            if ($LASTEXITCODE -ne 0) { throw "$name differs from the exact source commit: $normalized" }
            return $fullPath
          }

          $governancePath = Resolve-TrackedSourceFile $env:CONFIG_PATH 'config_path' $true
          $releasePath = Resolve-TrackedSourceFile $env:RELEASE_CONFIG_PATH 'release_config_path' $false
          "governance-path=$governancePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release-path=$releasePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download reviewed governance plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: powerforge-apple-governance-${{ inputs.source_ref }}-plan
          path: ${{ runner.temp }}/reviewed-governance-plan

      - name: Build exact PowerForge source
        id: build-powerforge
        uses: ./powerforge-shared/.github/actions/build-powerforge
        with:
          source-root: ${{ github.workspace }}/powerforge-shared
          runtime: ${{ inputs.tool_runtime }}

      - name: Apply only the reviewed Apple governance plan
        id: governance_apply
        uses: ./powerforge-shared/.github/actions/apple-governance
        with:
          operation: Apply
          config-path: ${{ steps.paths.outputs.governance-path }}
          release-config-path: ${{ steps.paths.outputs.release-path }}
          reviewed-plan-path: ${{ runner.temp }}/reviewed-governance-plan/powerforge-apple-governance-plan.json
          receipt-path: ${{ runner.temp }}/powerforge-apple-governance-actual.json
          tool-path: ${{ steps.build-powerforge.outputs.tool-path }}
          confirm: "true"
          maximum-changes: ${{ inputs.maximum_changes }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.caller_app_store_connect_issuer_id }}
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.caller_app_store_connect_key_id }}
          private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.caller_app_store_connect_private_key }}

      - name: Upload compact governance apply receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powerforge-apple-governance-${{ inputs.source_ref }}-actual
          path: ${{ steps.governance_apply.outputs.receipt-path }}
          if-no-files-found: error
          retention-days: 90
