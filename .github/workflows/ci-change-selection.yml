name: Select repository CI coverage

# Internal selection for this repository; existing shared workflow contracts are unchanged.
on:
  workflow_call:
    outputs:
      build:
        description: Whether the PR contains a build or test input.
        value: ${{ jobs.select.outputs.build }}
      web:
        description: Whether website engine coverage is needed (a web or shared input changed).
        value: ${{ jobs.select.outputs.web }}
      powershell:
        description: Whether PowerShell compiler and module qualification is needed (a non-web input changed).
        value: ${{ jobs.select.outputs.powershell }}

permissions:
  contents: read

jobs:
  select:
    name: Select changes
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      build: ${{ steps.select.outputs.build }}
      web: ${{ steps.select.outputs.web }}
      powershell: ${{ steps.select.outputs.powershell }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inspect the complete PR diff
        id: select
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os, pathlib, subprocess

          def documentation(path):
              parts = pathlib.PurePosixPath(path).parts
              # Package READMEs, generated help, fixtures, schemas and templates are inputs.
              if path.lower() in ('readme.md', 'docs/readme.md', 'docs/pspublishmodule.unifiedmoduleprojectrelease.md'):
                  return False
              if any(part.lower() in ('schema', 'schemas', 'fixtures', 'templates') for part in parts[:-1]):
                  return False
              if parts[0] == 'Website':
                  return True
              if any(part.lower() == 'examples' for part in parts[:-1]):
                  return False
              if len(parts) == 1:
                  return path.lower().endswith('.md')
              return parts[0] in ('Docs', 'docs') and pathlib.PurePosixPath(path).suffix.lower() in (
                  '.md', '.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp', '.ico')

          def web_only(path):
              # Inputs consumed only by the website engine and its tests. Shared
              # projects, build files and .github always select every lane.
              parts = pathlib.PurePosixPath(path).parts
              if parts[0].startswith('PowerForge.Web'):
                  return True
              if parts[0] == 'PowerForge.Tests' and len(parts) == 2 and parts[1].startswith('Web'):
                  return True
              if parts[0] == 'Schemas' and parts[-1].lower().startswith('powerforge.web.'):
                  return True
              return parts[0] == 'Samples' and len(parts) > 1 and parts[1].startswith('PowerForge.Web.')

          def outside_web(path):
              # Projects the website engine neither references nor tests.
              top = pathlib.PurePosixPath(path).parts[0]
              return top in ('PSPublishModule', 'Module', 'Modules', 'PowerForge.Cli') or \
                  top.startswith(('PowerForge.PowerShell', 'PowerForge.Backups', 'PowerForgeStudio'))

          build = web = powershell = True
          if os.environ['EVENT'] == 'pull_request':
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not base or not head:
                  raise SystemExit('Missing PR endpoints; refusing to skip coverage.')
              # No API file limit; disable rename detection so moves out of source retain deletions.
              diff = subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', f'{base}...{head}'])
              paths = [p.decode('utf-8', errors='surrogateescape') for p in diff.split(b'\0') if p]
              build = not paths or not all(documentation(p) for p in paths)
              code = [p for p in paths if not documentation(p)]
              web = any(not outside_web(p) for p in code)
              powershell = any(not web_only(p) for p in code)
              print(f'Inspected {len(paths)} changed paths; build required: {build}; web: {web}; powershell: {powershell}.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'build={str(build).lower()}\n')
              output.write(f'web={str(web).lower()}\n')
              output.write(f'powershell={str(powershell).lower()}\n')
