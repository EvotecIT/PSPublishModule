name: Publish a qualified npm archive

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact in this workflow run containing exactly one qualified tgz.
        required: true
        type: string
      package-name:
        required: true
        type: string
      version:
        required: true
        type: string
      sha256:
        description: SHA256 recorded by the job that built and qualified the archive.
        required: true
        type: string
      quality-run-id:
        description: Successful default-branch quality run for the caller's exact commit.
        required: true
        type: string
      quality-workflow:
        type: string
        default: quality.yml
      environment-name:
        description: Existing protected release environment, restricted to the default branch.
        required: true
        type: string
      release-tag-prefix:
        description: Reservation namespace from npm-release-version; empty for a manually versioned archive.
        type: string
        default: ''
      normal-release-tag-prefix:
        description: Opt in to published stable release tags in this namespace; the environment must allow only its tag pattern.
        type: string
        default: ''
      publish:
        description: Publish when true; otherwise validate and perform npm's dry run.
        type: boolean
        default: false
      bootstrap:
        description: First publication only; requires the environment's NPM_BOOTSTRAP_TOKEN secret.
        type: boolean
        default: false
    secrets:
      NPM_BOOTSTRAP_TOKEN:
        description: Named forwarding for the release environment secret; it may be empty outside bootstrap.
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}-${{ inputs.package-name }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: ${{ inputs.environment-name }}
    env:
      GH_TOKEN: ${{ github.token }}
      NPM_PACKAGE: ${{ inputs.package-name }}
      NPM_VERSION: ${{ inputs.version }}
      NPM_SHA256: ${{ inputs.sha256 }}
      NPM_EXECUTE: ${{ inputs.publish }}
      NPM_BOOTSTRAP: ${{ inputs.bootstrap }}
      QUALITY_RUN: ${{ inputs.quality-run-id }}
      QUALITY_WORKFLOW: ${{ inputs.quality-workflow }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SOURCE_PRIVATE: ${{ github.event.repository.private }}
      RELEASE_ENVIRONMENT: ${{ inputs.environment-name }}
      RELEASE_TAG_PREFIX: ${{ inputs.release-tag-prefix }}
      NORMAL_RELEASE_TAG_PREFIX: ${{ inputs.normal-release-tag-prefix }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Require successful quality checks for this default-branch commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = $env:GITHUB_SHA
          if ($sourceSha -notmatch '^[a-fA-F0-9]{40}$') { throw 'Invalid workflow source commit.' }
          $policyType = 'branch'
          $policyName = $env:DEFAULT_BRANCH
          if ($env:NORMAL_RELEASE_TAG_PREFIX) {
              if ($env:NORMAL_RELEASE_TAG_PREFIX -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$' -or
                  $env:GITHUB_EVENT_NAME -cnotin @('release', 'workflow_dispatch') -or
                  -not $env:GITHUB_REF.StartsWith('refs/tags/', [StringComparison]::Ordinal)) {
                  throw 'Normal npm releases require a published release event or a dispatch on its tag.'
              }
              $tag = $env:GITHUB_REF.Substring('refs/tags/'.Length)
              $tagPattern = '^' + [Regex]::Escape($env:NORMAL_RELEASE_TAG_PREFIX) + '((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)|\d{14})$'
              if ($tag -cnotmatch $tagPattern) { throw 'The release tag is outside the configured version namespace.' }
              if ($Matches[1] -notmatch '^\d{14}$' -and $Matches[1] -cne $env:NPM_VERSION) {
                  throw 'The versioned product tag and npm archive must use the same version.'
              }
              $releaseJson = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$([Uri]::EscapeDataString($tag))"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot read the published product release.' }
              $release = $releaseJson | ConvertFrom-Json
              if ($release.tag_name -cne $tag -or $release.draft -or $release.prerelease -or -not $release.published_at) {
                  throw 'npm publication requires the matching published stable product release.'
              }
              if ($env:GITHUB_EVENT_NAME -ceq 'release') {
                  $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
                  if ($event.action -cne 'published' -or $event.release.id -ne $release.id -or $event.release.tag_name -cne $tag) {
                      throw 'The event does not identify the published product release.'
                  }
              }
              $refJson = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$([Uri]::EscapeDataString($tag))"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the product release tag.' }
              $target = ($refJson | ConvertFrom-Json).object
              for ($depth = 0; $target.type -ceq 'tag' -and $depth -lt 8; $depth++) {
                  if ($target.sha -notmatch '^[a-fA-F0-9]{40}$') { throw 'Invalid annotated release tag.' }
                  $targetJson = & gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($target.sha)"
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the annotated product tag.' }
                  $target = ($targetJson | ConvertFrom-Json).object
              }
              if ($target.type -cne 'commit' -or $target.sha -cne $sourceSha) {
                  throw 'The product tag must resolve to the workflow source commit.'
              }
              $comparisonJson = & gh api "repos/$env:GITHUB_REPOSITORY/compare/$sourceSha...$([Uri]::EscapeDataString($env:DEFAULT_BRANCH))"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the product source on the default branch.' }
              if (($comparisonJson | ConvertFrom-Json).status -cnotin @('ahead', 'identical')) {
                  throw 'The product release source is not contained in the default branch.'
              }
              $policyType = 'tag'
              $policyName = $env:NORMAL_RELEASE_TAG_PREFIX + '*'
          } else {
              if ($env:GITHUB_EVENT_NAME -cnotin @('workflow_dispatch', 'workflow_run') -or
                  $env:GITHUB_REF -ne "refs/heads/$env:DEFAULT_BRANCH") {
                  throw 'npm publication requires a default-branch dispatch or completed quality run.'
              }
          }
          if (-not $env:NORMAL_RELEASE_TAG_PREFIX -and $env:GITHUB_EVENT_NAME -eq 'workflow_run') {
              $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
              if ($event.action -cne 'completed' -or [string]$event.workflow_run.id -cne $env:QUALITY_RUN -or
                  $event.workflow_run.head_repository.full_name -cne $env:GITHUB_REPOSITORY) {
                  throw 'The release event does not identify this repository''s qualifying source run.'
              }
              $sourceSha = [string]$event.workflow_run.head_sha
          }
          if ($sourceSha -notmatch '^[a-fA-F0-9]{40}$') { throw 'Invalid qualified source commit.' }
          $environmentPath = [Uri]::EscapeDataString($env:RELEASE_ENVIRONMENT)
          $environmentJson = & gh api "repos/$env:GITHUB_REPOSITORY/environments/$environmentPath"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the protected release environment.' }
          $environment = $environmentJson | ConvertFrom-Json
          $policiesJson = & gh api "repos/$env:GITHUB_REPOSITORY/environments/$environmentPath/deployment-branch-policies"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release deployment policies.' }
          $policies = $policiesJson | ConvertFrom-Json
          if (-not $environment.deployment_branch_policy.custom_branch_policies -or
              $policies.total_count -ne 1 -or $policies.branch_policies[0].type -cne $policyType -or
              $policies.branch_policies[0].name -cne $policyName) {
              throw 'The release environment must allow only the configured default branch or opted-in product tag namespace.'
          }
          if ($env:QUALITY_RUN -notmatch '^\d+$') { throw 'Invalid quality run ID.' }
          $runJson = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QUALITY_RUN"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the quality run.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.head_sha -ne $sourceSha -or $run.head_branch -ne $env:DEFAULT_BRANCH -or
              $run.event -ne 'push' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or
              ($run.path -split '@', 2)[0] -ne ".github/workflows/$env:QUALITY_WORKFLOW") {
              throw 'The supplied quality run does not qualify this default-branch commit.'
          }
          "QUALIFIED_SOURCE_SHA=$sourceSha" >> $env:GITHUB_ENV

      - name: Download the qualified archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/npm-release

      - name: Setup Node for npm Trusted Publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: ${{ inputs.bootstrap && inputs.publish && 'https://registry.npmjs.org' || '' }}

      - name: Install the qualified npm CLI
        env:
          NODE_AUTH_TOKEN: ''
        run: npm install --global npm@11.21.0 --no-audit --no-fund

      - name: Verify archive identity and publish the same bytes
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap && inputs.publish && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (@('true', 'false') -cnotcontains $env:SOURCE_PRIVATE) {
              throw 'Source repository visibility is required before publication.'
          }
          $requireProvenance = $env:SOURCE_PRIVATE -eq 'false'
          if ($env:QUALIFIED_SOURCE_SHA -notmatch '^[a-fA-F0-9]{40}$') { throw 'A validated package source commit is required.' }
          if ($env:NPM_SHA256 -notmatch '^[a-fA-F0-9]{64}$' -or
              $env:NPM_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'A three-part version and SHA256 are required.'
          }
          $archives = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/npm-release" -File -Recurse -Filter '*.tgz')
          if ($archives.Count -ne 1) { throw 'Expected exactly one npm archive.' }
          $archive = $archives[0].FullName
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:NPM_SHA256) {
              throw 'Archive SHA256 differs from the qualified build.'
          }
          $manifestJson = & tar -xOf $archive package/package.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the packed package manifest.' }
          $manifest = $manifestJson | ConvertFrom-Json
          if ($manifest.name -cne $env:NPM_PACKAGE -or $manifest.version -cne $env:NPM_VERSION -or
              $manifest.private -eq $true -or
              $manifest.repository.url -cne "git+https://github.com/$env:GITHUB_REPOSITORY.git") {
              throw 'Packed package identity or source repository does not match the release.'
          }
          $integrity = 'sha512-' + [Convert]::ToBase64String(
              [Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($archive)))
          $archiveSha512 = [Convert]::ToHexString([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($archive))).ToLowerInvariant()
          $verificationDeadline = [DateTime]::MaxValue
          function Invoke-NpmRegistryRequest([string] $Url, [double] $TimeoutSeconds) {
              $client = [Net.Http.HttpClient]::new()
              $response = $null
              try {
                  $client.Timeout = [TimeSpan]::FromSeconds($TimeoutSeconds)
                  $client.DefaultRequestHeaders.Add('Cache-Control', 'no-cache')
                  # Include the entire body in HttpClient's total request timeout.
                  $response = $client.GetAsync($Url, [Net.Http.HttpCompletionOption]::ResponseContentRead).GetAwaiter().GetResult()
                  return [pscustomobject]@{
                      StatusCode = [int]$response.StatusCode
                      Content = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                  }
              } finally {
                  if ($response) { $response.Dispose() }
                  $client.Dispose()
              }
          }
          function Read-NpmRegistry([string] $Url) {
              $remainingSeconds = ($verificationDeadline - (Get-Date).ToUniversalTime()).TotalSeconds
              if ($remainingSeconds -le 0) { return $null }
              try {
                  $response = Invoke-NpmRegistryRequest -Url $Url -TimeoutSeconds ([Math]::Min([double]15, $remainingSeconds))
              } catch {
                  Write-Warning 'The registry read failed; publication verification will retry without uploading again.'
                  return $null
              }
              if ($response.StatusCode -eq 200) { return $response }
              if ($response.StatusCode -in @(404, 408, 429) -or $response.StatusCode -ge 500) { return $null }
              throw "Registry verification failed with HTTP $($response.StatusCode). Inspect the accepted publication before retrying."
          }
          function Test-PublishedProvenance($Dist) {
              if (-not $requireProvenance) { return $true }
              if (-not $Dist.attestations.provenance) { return $false }
              $url = 'https://registry.npmjs.org/-/npm/v1/attestations/' + [Uri]::EscapeDataString($env:NPM_PACKAGE) + '@' + $env:NPM_VERSION
              $response = Read-NpmRegistry $url
              if (-not $response) { return $false }
              $attestations = $response.Content | ConvertFrom-Json
              foreach ($attestation in $attestations.attestations) {
                  if ($attestation.predicateType -cne 'https://slsa.dev/provenance/v1') { continue }
                  $payload = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($attestation.bundle.dsseEnvelope.payload)) | ConvertFrom-Json
                  $dependency = @($payload.predicate.buildDefinition.resolvedDependencies | Where-Object {
                      $_.uri -ceq "git+https://github.com/$env:GITHUB_REPOSITORY@$env:GITHUB_REF" -and
                      $_.digest.gitCommit -ceq $env:QUALIFIED_SOURCE_SHA
                  })
                  $subject = @($payload.subject | Where-Object { $_.digest.sha512 -ceq $archiveSha512 })
                  if ($dependency.Count -ne 1 -or $subject.Count -ne 1) { throw 'Published provenance does not identify the qualified source and archive.' }
                  return $true
              }
              return $false
          }
          if ($env:NPM_BOOTSTRAP -ne 'true') {
              $versionUrl = 'https://registry.npmjs.org/' + [Uri]::EscapeDataString($env:NPM_PACKAGE) + '/' + $env:NPM_VERSION
              $existingVersion = Invoke-WebRequest -Uri $versionUrl -SkipHttpErrorCheck
              if ($existingVersion.StatusCode -eq 200) {
                  $published = $existingVersion.Content | ConvertFrom-Json
                  if ($published.name -cne $env:NPM_PACKAGE -or $published.version -cne $env:NPM_VERSION -or
                      $published.dist.integrity -cne $integrity -or -not (Test-PublishedProvenance $published.dist)) {
                      throw 'An existing npm version differs from the qualified archive or required provenance.'
                  }
                  "Already verified: $env:NPM_PACKAGE@$env:NPM_VERSION; no repeat upload." >> $env:GITHUB_STEP_SUMMARY
                  exit 0
              }
              if ($existingVersion.StatusCode -ne 404) { throw 'Cannot establish whether this npm version is already published.' }
          }
          if ($env:NPM_BOOTSTRAP -eq 'true') {
              if ($env:NPM_EXECUTE -ne 'true' -or [string]::IsNullOrWhiteSpace($env:NODE_AUTH_TOKEN)) {
                  throw 'Bootstrap requires an explicit publication and the environment NPM_BOOTSTRAP_TOKEN secret.'
              }
              $packageUrl = 'https://registry.npmjs.org/' + [Uri]::EscapeDataString($env:NPM_PACKAGE)
              $existing = Invoke-WebRequest -Uri $packageUrl -SkipHttpErrorCheck -Headers @{
                  Authorization = "Bearer $env:NODE_AUTH_TOKEN"
              }
              if ($existing.StatusCode -ne 404) {
                  throw 'Bootstrap requires an authenticated registry check confirming that the package does not exist.'
              }
          }
          if ($requireProvenance -and $env:QUALIFIED_SOURCE_SHA -cne $env:GITHUB_SHA) {
              throw 'Public-source provenance requires the qualified source to match GitHub''s OIDC source identity. Wait for successful quality checks on that source before releasing.'
          }
          $publishArgs = @('publish', $archive, '--ignore-scripts', "--provenance=$($requireProvenance.ToString().ToLowerInvariant())", '--access', 'public',
              '--registry', 'https://registry.npmjs.org')
          if ($env:NPM_EXECUTE -ne 'true') { $publishArgs += '--dry-run' }
          if ($env:RELEASE_TAG_PREFIX) {
              if ($env:RELEASE_TAG_PREFIX -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') { throw 'Invalid release reservation namespace.' }
              $refsJson = & gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:RELEASE_TAG_PREFIX" --paginate --slurp
              if ($LASTEXITCODE -ne 0) { throw 'Cannot recheck release reservations before publication.' }
              $prefix = "refs/tags/$env:RELEASE_TAG_PREFIX"
              $reservations = @((($refsJson | ConvertFrom-Json) | ForEach-Object { $_ }) | Where-Object {
                  $_.ref.StartsWith($prefix, [StringComparison]::Ordinal) -and
                  $_.ref.Substring($prefix.Length) -match '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
              })
              $current = @($reservations | Where-Object { $_.ref -ceq "$prefix$env:NPM_VERSION" })
              if ($env:NPM_EXECUTE -eq 'true' -and ($current.Count -ne 1 -or
                  $current[0].object.type -cne 'commit' -or $current[0].object.sha -cne $env:QUALIFIED_SOURCE_SHA)) {
                  throw 'The release version is not reserved for the qualified source.'
              }
              $highest = $reservations | Sort-Object { [Version]::Parse($_.ref.Substring($prefix.Length)) } -Descending | Select-Object -First 1
              if ($highest -and $highest.object.sha -cne $env:QUALIFIED_SOURCE_SHA) {
                  if ($highest.object.type -cne 'commit' -or $highest.object.sha -notmatch '^[a-fA-F0-9]{40}$') { throw 'Invalid reserved source identity.' }
                  $comparisonJson = & gh api "repos/$env:GITHUB_REPOSITORY/compare/$env:QUALIFIED_SOURCE_SHA...$($highest.object.sha)"
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot recheck release source ancestry.' }
                  if (($comparisonJson | ConvertFrom-Json).status -cne 'behind') {
                      throw 'A newer or diverged source reservation prevents this upload. Run version selection again before retrying.'
                  }
              }
          }
          & npm @publishArgs
          if ($LASTEXITCODE -ne 0) { throw 'npm publication or dry run failed.' }
          if ($env:NPM_EXECUTE -eq 'true') {
              $verified = $false
              $verificationDeadline = (Get-Date).ToUniversalTime().AddMinutes(30)
              $delaySeconds = 5
              $versionUrl = 'https://registry.npmjs.org/' + [Uri]::EscapeDataString($env:NPM_PACKAGE) + '/' + $env:NPM_VERSION
              Write-Output 'npm accepted the upload. Waiting up to 30 minutes for registry identity, integrity and required provenance; no further upload will be attempted.'
              while ((Get-Date).ToUniversalTime() -lt $verificationDeadline) {
                  $response = Read-NpmRegistry $versionUrl
                  if ($response) {
                      $published = $response.Content | ConvertFrom-Json
                      if ($published.name -cne $env:NPM_PACKAGE -or $published.version -cne $env:NPM_VERSION) { throw 'Published package identity does not match.' }
                      if ($published.dist.integrity -cne $integrity) { throw 'Published archive integrity does not match.' }
                      if (Test-PublishedProvenance $published.dist) { $verified = $true; break }
                  }
                  $remainingSeconds = [Math]::Floor(($verificationDeadline - (Get-Date).ToUniversalTime()).TotalSeconds)
                  if ($remainingSeconds -le 0) { break }
                  $sleepSeconds = [Math]::Min($delaySeconds, $remainingSeconds)
                  Write-Output "Registry verification is pending; checking again in $sleepSeconds seconds without repeating publication."
                  Start-Sleep -Seconds $sleepSeconds
                  $delaySeconds = [Math]::Min(60, $delaySeconds * 2)
              }
              if (-not $verified) {
                  throw 'npm accepted publication, but registry verification did not complete within 30 minutes. Inspect the registry before retrying; an existing matching version can be reconciled without another upload.'
              }
          }
          "Package: $env:NPM_PACKAGE@$env:NPM_VERSION`nSHA256: $env:NPM_SHA256`nPublished: $env:NPM_EXECUTE`nProvenance required: $requireProvenance" >> $env:GITHUB_STEP_SUMMARY
