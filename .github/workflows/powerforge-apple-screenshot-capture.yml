name: PowerForge Apple Screenshot Capture

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to capture.
        required: true
        type: string
      marketing_version:
        description: Exact x.y or x.y.z App Store version represented by the captures and approval.
        required: true
        type: string
      capture_script:
        description: Repository-relative deterministic capture script.
        required: true
        type: string
      capture_shell:
        description: Capture script host (bash or pwsh).
        required: false
        default: bash
        type: string
      capture_artifact_path:
        description: Repository-relative folder produced by the capture script.
        required: false
        default: build/appstore-screenshots
        type: string
      runner_labels_json:
        description: JSON array of trusted Apple runner labels.
        required: false
        default: '["self-hosted","macOS","ARM64"]'
        type: string
      device:
        description: Device matrix identity captured with the screenshot evidence.
        required: false
        default: configured Apple screenshot matrix
        type: string
      runtime:
        description: Exact platform runtime represented by the captures, such as iOS 26.0 Simulator or macOS 26.0.
        required: true
        type: string
      theme:
        description: Appearance matrix captured with the screenshot evidence.
        required: false
        default: light-and-dark
        type: string
      scenario:
        description: Stable scenario identity captured with the screenshot evidence.
        required: false
        default: app-store-publication
        type: string

concurrency:
  group: powerforge-apple-screenshot-capture-${{ github.repository }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Require immutable source and supported shell
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          CAPTURE_SHELL: ${{ inputs.capture_shell }}
          CAPTURE_RUNTIME: ${{ inputs.runtime }}
        run: |
          if ($env:SOURCE_REF -notmatch '^[0-9A-Fa-f]{40}$') { throw 'source_ref must be an exact 40-character commit SHA.' }
          if ($env:MARKETING_VERSION -notmatch '^\d+\.\d+(?:\.\d+)?$') { throw 'marketing_version must use x.y or x.y.z.' }
          if ($env:CAPTURE_SHELL -notin @('bash', 'pwsh')) { throw 'capture_shell must be bash or pwsh.' }
          if ([string]::IsNullOrWhiteSpace($env:CAPTURE_RUNTIME) -or $env:CAPTURE_RUNTIME.Length -gt 200 -or $env:CAPTURE_RUNTIME -match '[\r\n]') {
            throw 'runtime must be a non-empty single-line platform runtime no longer than 200 characters.'
          }

      - name: Checkout exact screenshot source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Capture deterministic App Store screenshots
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          CAPTURE_SCRIPT: ${{ inputs.capture_script }}
          CAPTURE_SHELL: ${{ inputs.capture_shell }}
          CAPTURE_ARTIFACT_PATH: ${{ inputs.capture_artifact_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = [IO.Path]::GetFullPath('${{ github.workspace }}/source').TrimEnd([IO.Path]::DirectorySeparatorChar)
          $scriptPath = [IO.Path]::GetFullPath((Join-Path $sourceRoot $env:CAPTURE_SCRIPT))
          $artifactPath = [IO.Path]::GetFullPath((Join-Path $sourceRoot $env:CAPTURE_ARTIFACT_PATH))
          $comparison = if ($IsWindows) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
          $prefix = $sourceRoot + [IO.Path]::DirectorySeparatorChar
          if (((Get-Item -LiteralPath $sourceRoot -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "Checked-out source must not be a symbolic link or reparse point: $sourceRoot"
          }

          function Assert-UnlinkedSourcePath {
            param(
              [Parameter(Mandatory)] [string] $Path,
              [Parameter(Mandatory)] [string] $Name
            )

            $current = $Path
            while (-not $current.Equals($sourceRoot, $comparison)) {
              if (Test-Path -LiteralPath $current) {
                $item = Get-Item -LiteralPath $current -Force
                if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  throw "$Name must not traverse a symbolic link or reparse point: $current"
                }
              }
              $parent = Split-Path -Parent $current
              if ([string]::IsNullOrWhiteSpace($parent) -or $parent.Equals($current, $comparison)) {
                throw "$Name could not be validated inside the checked-out source."
              }
              $current = $parent
            }
          }

          foreach ($entry in @{ capture_script = $scriptPath; capture_artifact_path = $artifactPath }.GetEnumerator()) {
            if (-not $entry.Value.StartsWith($prefix, $comparison)) { throw "$($entry.Key) escapes the checked-out source." }
          }
          $actualCommit = (& git -C $sourceRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $actualCommit.Equals($env:SOURCE_REF, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Capture source '$actualCommit' does not match source_ref '$($env:SOURCE_REF)'."
          }
          Assert-UnlinkedSourcePath -Path $scriptPath -Name 'Capture script'
          Assert-UnlinkedSourcePath -Path $artifactPath -Name 'Capture artifact'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) { throw "Capture script was not found: $scriptPath" }
          $relativeScript = [IO.Path]::GetRelativePath($sourceRoot, $scriptPath).Replace('\', '/')
          & git -C $sourceRoot ls-files --error-unmatch -- $relativeScript *> $null
          if ($LASTEXITCODE -ne 0) { throw "Capture script must be tracked at the exact source commit: $relativeScript" }
          & git -C $sourceRoot diff --quiet HEAD -- $relativeScript
          if ($LASTEXITCODE -ne 0) { throw "Capture script differs from the exact source commit: $relativeScript" }

          Push-Location $sourceRoot
          try {
            if ($env:CAPTURE_SHELL -eq 'bash') { & bash $scriptPath } else { & pwsh -NoLogo -NoProfile -File $scriptPath }
            if ($LASTEXITCODE -ne 0) { throw "Screenshot capture failed with exit code $LASTEXITCODE." }
          } finally { Pop-Location }

          if (-not (Test-Path -LiteralPath $artifactPath -PathType Container)) { throw "Capture artifact folder was not created: $artifactPath" }
          Assert-UnlinkedSourcePath -Path $artifactPath -Name 'Capture artifact'
          $artifactItems = @(Get-ChildItem -LiteralPath $artifactPath -Force -Recurse)
          $linkedArtifact = $artifactItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 } | Select-Object -First 1
          if ($null -ne $linkedArtifact) {
            throw "Capture artifact must not traverse a symbolic link or reparse point: $($linkedArtifact.FullName)"
          }
          if (@($artifactItems | Where-Object { -not $_.PSIsContainer -and $_.Extension -ieq '.png' }).Count -eq 0) {
            throw 'Capture produced no PNG screenshots.'
          }

      - name: Record capture provenance
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          CAPTURE_DEVICE: ${{ inputs.device }}
          CAPTURE_RUNTIME: ${{ inputs.runtime }}
          CAPTURE_THEME: ${{ inputs.theme }}
          CAPTURE_SCENARIO: ${{ inputs.scenario }}
          CAPTURE_ARTIFACT_PATH: ${{ inputs.capture_artifact_path }}
        run: |
          $sourceRoot = [IO.Path]::GetFullPath('${{ github.workspace }}/source')
          $artifactRoot = [IO.Path]::GetFullPath((Join-Path $sourceRoot $env:CAPTURE_ARTIFACT_PATH))
          $screenshots = @(Get-ChildItem -LiteralPath $artifactRoot -File -Filter '*.png' -Recurse | Sort-Object FullName | ForEach-Object {
            $dimensions = @(& sips -g pixelWidth -g pixelHeight $_.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Unable to read PNG dimensions: $($_.FullName)" }
            $widthLine = $dimensions | Where-Object { $_ -match '^\s*pixelWidth:\s*(\d+)\s*$' } | Select-Object -First 1
            $heightLine = $dimensions | Where-Object { $_ -match '^\s*pixelHeight:\s*(\d+)\s*$' } | Select-Object -First 1
            if (-not $widthLine -or -not $heightLine) { throw "Unable to parse PNG dimensions: $($_.FullName)" }
            $width = [int]([regex]::Match($widthLine, '(\d+)\s*$').Groups[1].Value)
            $height = [int]([regex]::Match($heightLine, '(\d+)\s*$').Groups[1].Value)
            [ordered]@{
              path = [IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\\', '/')
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              width = $width
              height = $height
            }
          })
          if ($screenshots.Count -eq 0) { throw 'Capture provenance requires at least one PNG screenshot.' }
          $xcodeVersion = (& xcodebuild -version) -join ' '
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($xcodeVersion)) { throw 'Unable to record the capture Xcode version.' }
          $captureRuntime = $env:CAPTURE_RUNTIME.Trim()
          $provenance = [ordered]@{
            schemaVersion = 2
            repository = $env:GITHUB_REPOSITORY
            captureRunId = $env:GITHUB_RUN_ID
            sourceCommit = $env:SOURCE_REF.ToLowerInvariant()
            marketingVersion = $env:MARKETING_VERSION
            workflowRef = $env:GITHUB_WORKFLOW_REF
            xcodeVersion = $xcodeVersion
            runtime = $captureRuntime
            device = $env:CAPTURE_DEVICE
            theme = $env:CAPTURE_THEME
            scenario = $env:CAPTURE_SCENARIO
            screenshots = $screenshots
          }
          $provenance | ConvertTo-Json -Depth 5 -Compress |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'powerforge-apple-screenshot-provenance.json') -Encoding utf8

      - name: Retain compact capture provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powerforge-apple-screenshot-provenance-${{ inputs.source_ref }}
          path: ${{ runner.temp }}/powerforge-apple-screenshot-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain exact captures for manual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powerforge-apple-screenshots-${{ inputs.source_ref }}
          path: source/${{ inputs.capture_artifact_path }}/**/*.png
          if-no-files-found: error
          retention-days: 30
