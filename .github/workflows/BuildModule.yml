# This is a basic workflow to help you get started with Actions

name: Test & Build Module

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events for the default branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      privateGalleryLiveValidation:
        description: Run the opt-in live Azure Artifacts private gallery validation job.
        required: true
        default: false
        type: boolean
      privateGalleryOrganization:
        description: Azure DevOps organization name for live validation.
        required: false
        type: string
      privateGalleryProject:
        description: Optional Azure DevOps project name for project-scoped feeds.
        required: false
        type: string
      privateGalleryFeed:
        description: Azure Artifacts feed name for live validation.
        required: false
        type: string
      privateGalleryModuleName:
        description: Existing module name to install/update from the feed.
        required: false
        type: string
      privateGalleryProfileName:
        description: Temporary PSPublishModule profile name used during validation.
        required: false
        type: string
      privateGalleryGenerateDisposablePackage:
        description: Also publish a generated disposable NuGet package to prove package push.
        required: true
        default: false
        type: boolean
      privateGalleryDisposablePackageName:
        description: Disposable package ID used when package-push proof is enabled.
        required: false
        type: string
      privateGalleryDisposablePackageVersion:
        description: Optional disposable package version. Leave blank for timestamped version.
        required: false
        type: string
      privateGalleryRunnerLabels:
        description: JSON array of runner labels. Defaults to PSPUBLISHMODULE_AZDO_RUNNER_LABELS variable or self-hosted Windows.
        required: false
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  WorkflowLint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Validate website workflows
        shell: bash
        run: |
          set -euo pipefail

          readonly actionlint_version='1.7.12'
          readonly actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          readonly actionlint_sha256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          readonly actionlint_url="https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_archive}"
          readonly lint_root="${RUNNER_TEMP}/powerforge-actionlint"

          rm --recursive --force "$lint_root"
          mkdir --parents "$lint_root/.github/workflows"
          curl --fail --location --silent --show-error "$actionlint_url" --output "$lint_root/$actionlint_archive"
          printf '%s  %s\n' "$actionlint_sha256" "$lint_root/$actionlint_archive" | sha256sum --check --strict
          tar --extract --gzip --file "$lint_root/$actionlint_archive" --directory "$lint_root" actionlint

          readonly -a website_workflows=(
            '.github/workflows/powerforge-website-ci.yml'
            '.github/workflows/powerforge-website-deploy.yml'
            '.github/workflows/powerforge-website-maintenance.yml'
            '.github/workflows/powerforge-website-run.yml'
          )

          # GitHub added job.workflow_* identity fields after actionlint's current schema.
          # Lint copies with only those five documented fields normalized to another string field.
          readonly workflow_identity_expression='\$\{\{[[:space:]]*job\.workflow_(repository|sha|ref|file_path)[[:space:]]*\}\}'
          readonly replacement_expression='$'"{{ job.status }}"
          readonly expected_workflow_identity_count=5
          workflow_identity_count="$({ grep --no-filename --only-matching --extended-regexp "$workflow_identity_expression" "${website_workflows[@]}" || true; } | wc --lines | tr --delete '[:space:]')"
          if [[ "$workflow_identity_count" != "$expected_workflow_identity_count" ]]; then
            printf 'Expected %s documented job.workflow_* expressions, found %s.\n' "$expected_workflow_identity_count" "$workflow_identity_count" >&2
            exit 1
          fi

          lint_workflows=()
          for workflow in "${website_workflows[@]}"; do
            lint_workflow="$lint_root/$workflow"
            cp "$workflow" "$lint_workflow"
            sed --regexp-extended --in-place "s#$workflow_identity_expression#$replacement_expression#g" "$lint_workflow"
            lint_workflows+=("$lint_workflow")
          done

          "$lint_root/actionlint" -oneline "${lint_workflows[@]}"

  DependencyAudit:
    # Prefer private/self-hosted runners for private repos to reduce hosted spend.
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'NuGet.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: NuGet vulnerability audit (informational)
        shell: pwsh
        continue-on-error: true
        run: dotnet list ./PSPublishModule.sln package --vulnerable --include-transitive
  PrivateGalleryLiveValidation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.privateGalleryLiveValidation == true }}
    runs-on: ${{ fromJSON(inputs.privateGalleryRunnerLabels || vars.PSPUBLISHMODULE_AZDO_RUNNER_LABELS || '["self-hosted","windows"]') }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'NuGet.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build PSPublishModule
        shell: pwsh
        timeout-minutes: 15
        run: .\Build\Build-Project.ps1 -ModuleOnly

      - name: Run live Azure Artifacts validation
        shell: pwsh
        timeout-minutes: 15
        env:
          AZDO_ORGANIZATION: ${{ inputs.privateGalleryOrganization || vars.PSPUBLISHMODULE_AZDO_ORGANIZATION }}
          AZDO_PROJECT: ${{ inputs.privateGalleryProject || vars.PSPUBLISHMODULE_AZDO_PROJECT }}
          AZDO_FEED: ${{ inputs.privateGalleryFeed || vars.PSPUBLISHMODULE_AZDO_FEED }}
          AZDO_MODULE_NAME: ${{ inputs.privateGalleryModuleName || vars.PSPUBLISHMODULE_AZDO_MODULE_NAME }}
          AZDO_PROFILE_NAME: ${{ inputs.privateGalleryProfileName || vars.PSPUBLISHMODULE_AZDO_PROFILE_NAME || 'LiveAzureArtifacts' }}
          AZDO_GENERATE_DISPOSABLE_PACKAGE: ${{ inputs.privateGalleryGenerateDisposablePackage }}
          AZDO_DISPOSABLE_PACKAGE_NAME: ${{ inputs.privateGalleryDisposablePackageName || vars.PSPUBLISHMODULE_AZDO_DISPOSABLE_PACKAGE_NAME || 'PSPublishModule.PrivateGallery.LiveValidation' }}
          AZDO_DISPOSABLE_PACKAGE_VERSION: ${{ inputs.privateGalleryDisposablePackageVersion || vars.PSPUBLISHMODULE_AZDO_DISPOSABLE_PACKAGE_VERSION }}
          ARTIFACTS_CREDENTIALPROVIDER_EXTERNAL_FEED_ENDPOINTS: ${{ secrets.PSPUBLISHMODULE_AZDO_ARTIFACTS_EXTERNAL_FEED_ENDPOINTS }}
          ARTIFACTS_CREDENTIALPROVIDER_FEED_ENDPOINTS: ${{ secrets.PSPUBLISHMODULE_AZDO_ARTIFACTS_FEED_ENDPOINTS }}
          VSS_NUGET_EXTERNAL_FEED_ENDPOINTS: ${{ secrets.PSPUBLISHMODULE_AZDO_VSS_NUGET_EXTERNAL_FEED_ENDPOINTS }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:AZDO_ORGANIZATION)) { $missing += 'privateGalleryOrganization or PSPUBLISHMODULE_AZDO_ORGANIZATION variable' }
          if ([string]::IsNullOrWhiteSpace($env:AZDO_FEED)) { $missing += 'privateGalleryFeed or PSPUBLISHMODULE_AZDO_FEED variable' }
          if ([string]::IsNullOrWhiteSpace($env:AZDO_MODULE_NAME)) { $missing += 'privateGalleryModuleName or PSPUBLISHMODULE_AZDO_MODULE_NAME variable' }
          if ($missing.Count -gt 0) {
              throw "Private gallery live validation is enabled, but required workflow input(s)/variable(s) are missing: $($missing -join ', ')."
          }

          $outputRoot = Join-Path $PWD 'live-validation-output'
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null

          $arguments = @{
              Organization       = $env:AZDO_ORGANIZATION
              Feed               = $env:AZDO_FEED
              ModuleName         = $env:AZDO_MODULE_NAME
              ProfileName        = $env:AZDO_PROFILE_NAME
              OutputFile         = Join-Path $outputRoot 'private-gallery-live.xml'
              EvidenceFile       = Join-Path $outputRoot 'private-gallery-live.evidence.json'
              ModuleManifestPath = Join-Path $PWD 'Module\PSPublishModule.psd1'
              Output             = 'Detailed'
          }

          if (-not [string]::IsNullOrWhiteSpace($env:AZDO_PROJECT)) {
              $arguments.Project = $env:AZDO_PROJECT
          }

          if ($env:AZDO_GENERATE_DISPOSABLE_PACKAGE -eq 'true') {
              $arguments.GenerateDisposablePackage = $true
              $arguments.DisposablePackageName = $env:AZDO_DISPOSABLE_PACKAGE_NAME
              if (-not [string]::IsNullOrWhiteSpace($env:AZDO_DISPOSABLE_PACKAGE_VERSION)) {
                  $arguments.DisposablePackageVersion = $env:AZDO_DISPOSABLE_PACKAGE_VERSION
              }
          }

          .\Module\Tests\Invoke-PrivateGalleryAzureArtifactsLiveValidation.ps1 @arguments

      - name: Summarize live validation evidence
        if: always()
        shell: pwsh
        run: |
          $evidencePath = Join-Path $PWD 'live-validation-output\private-gallery-live.evidence.json'
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
              return
          }

          .\Module\Tests\Convert-PrivateGalleryLiveEvidenceToMarkdown.ps1 -EvidenceFile $evidencePath |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload live validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-gallery-live-validation
          path: live-validation-output
          if-no-files-found: warn
          retention-days: 14
  WindowsBuild:
    # The type of runner that the job will run on
    # Prefer private/self-hosted runners for private repos to reduce hosted spend.
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","windows"]' || '["windows-latest"]') }}
    timeout-minutes: 15

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'NuGet.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify net472 compatibility
        shell: pwsh
        timeout-minutes: 10
        run: |
          dotnet build .\PowerForge\PowerForge.csproj -c Release -f net472 --nologo
          dotnet build .\PowerForge.PowerShell.ProviderSdk\PowerForge.PowerShell.ProviderSdk.csproj -c Release -f net472 --nologo
          dotnet build .\PowerForge.PowerShell.Provider.Management\PowerForge.PowerShell.Provider.Management.csproj -c Release -f net472 --nologo
          dotnet build .\PowerForge.PowerShell.Provider.Management.Runtime\PowerForge.PowerShell.Provider.Management.Runtime.csproj -c Release -f net10.0 --nologo
          dotnet build .\PowerForge.PowerShell\PowerForge.PowerShell.csproj -c Release -f net472 --nologo
          dotnet build .\PSPublishModule\PSPublishModule.csproj -c Release -f net472 --nologo

      - name: Run net472 C# smoke tests
        shell: pwsh
        timeout-minutes: 10
        run: dotnet test .\PowerForge.Net472SmokeTests\PowerForge.Net472SmokeTests.csproj -c Release -f net472 --nologo

      - name: Build Module
        shell: pwsh
        timeout-minutes: 10
        run: .\Build\Build-Project.ps1 -ModuleOnly

      - name: Test with Windows PowerShell 5.1
        shell: pwsh
        timeout-minutes: 10
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\PSPublishModule.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test with PowerShell 7
        shell: pwsh
        timeout-minutes: 10
        run: .\PSPublishModule.Tests.ps1
  ProductBuildSmoke:
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","windows"]' || '["windows-latest"]') }}
    timeout-minutes: 60
    env:
      DbaClientXRoot: ${{ github.workspace }}\_dependencies\DbaClientX

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the shared DbaClientX source
        uses: actions/checkout@v7
        with:
          repository: EvotecIT/DbaClientX
          path: _dependencies/DbaClientX

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-product-nuget-${{ hashFiles('global.json', 'NuGet.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-product-nuget-
            ${{ runner.os }}-nuget-

      - name: Restore core product graph
        shell: pwsh
        run: dotnet restore .\PSPublishModule.Core.slnf --force-evaluate

      - name: Build core product graph
        shell: pwsh
        run: dotnet build .\PSPublishModule.Core.slnf -c Release --no-restore --nologo

      - name: Run core release contracts
        shell: pwsh
        timeout-minutes: 5
        run: >
          dotnet test .\PowerForge.Tests\PowerForge.Tests.csproj
          -c Release --no-restore --no-build --nologo
          --filter 'FullyQualifiedName~DotNetPublishPipelineRunnerCancellationTests|FullyQualifiedName~GitHubReleasePublisherTests|FullyQualifiedName~RepositoryPublisherTests'

      - name: Run no-publish core product build smoke
        shell: pwsh
        timeout-minutes: 30
        run: .\Build\Test-ProductBuild.ps1 -Runtime win-x64
  LinuxBuild:
    # The type of runner that the job will run on
    # Prefer private/self-hosted runners for private repos to reduce hosted spend.
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'NuGet.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Module
        shell: pwsh
        timeout-minutes: 10
        run: .\Build\Build-Project.ps1 -ModuleOnly

      - name: Test cross-platform Cloudflare website contracts
        shell: pwsh
        timeout-minutes: 10
        run: >
          dotnet test .\PowerForge.Tests\PowerForge.Tests.csproj
          -c Release --nologo
          --filter 'FullyQualifiedName~WebPipelineRunnerCloudflareTests'

      - name: Test Linux website deployment state machine
        shell: bash
        run: sudo bash Deployment/Linux/tests/powerforge-site-deploy-fixture.sh

      - name: Test Linux secret restore safety
        shell: bash
        run: sudo bash Deployment/Linux/tests/powerforge-secret-restore-fixture.sh

      - name: Test with Pester
        shell: pwsh
        timeout-minutes: 10
        run: .\PSPublishModule.Tests.ps1
  MacOsBuild:
    # The type of runner that the job will run on
    # Prefer private/self-hosted runners for private repos to reduce hosted spend.
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","macOS"]' || '["macos-latest"]') }}
    timeout-minutes: 15

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'NuGet.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Module
        shell: pwsh
        timeout-minutes: 10
        run: .\Build\Build-Project.ps1 -ModuleOnly

      - name: Test with Pester
        shell: pwsh
        timeout-minutes: 10
        run: .\PSPublishModule.Tests.ps1
