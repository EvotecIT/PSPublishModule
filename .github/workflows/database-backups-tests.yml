name: Database backups
on:
  pull_request:
    paths:
      - 'PowerForge.Backups*/**'
      - 'Deployment/Synology/**'
      - 'Deployment/Monitoring/**'
      - 'Deployment/Windows/Install-PowerForgeDatabaseBackup.ps1'
      - 'Deployment/Windows/DatabaseBackupInstallation.ps1'
      - 'Deployment/Windows/Test-DatabaseBackupInstallation.ps1'
      - '.github/workflows/database-backups-tests.yml'
      - '!**/*.md'
      - '!**/*.MD'
  push:
    branches: [main]
    paths:
      - 'PowerForge.Backups*/**'
      - 'Deployment/Synology/**'
      - 'Deployment/Monitoring/**'
      - 'Deployment/Windows/Install-PowerForgeDatabaseBackup.ps1'
      - 'Deployment/Windows/DatabaseBackupInstallation.ps1'
      - 'Deployment/Windows/Test-DatabaseBackupInstallation.ps1'
      - '.github/workflows/database-backups-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
# Only a newer revision of the same PR may cancel an earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-22.04
            python: '3.8'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: dotnet test PowerForge.Backups.Tests/PowerForge.Backups.Tests.csproj -c Release
      - run: python -B -m unittest discover -s Deployment/Monitoring -v
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./Deployment/Windows/Test-DatabaseBackupInstallation.ps1 -TemporaryRoot $env:TEMP -IncludePrivilegedCreation
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./Deployment/Windows/Test-DatabaseBackupInstallation.ps1 -TemporaryRoot $env:TEMP -IncludePrivilegedCreation
      - if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s Deployment/Synology -v
