name: PowerForge TestFlight request

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      pull_request:
        description: Optional merged PR number for Build now. The worker builds latest qualified main containing it.
        required: false
        default: ''
        type: string

# This job records intent. It never checks out application source or accesses Apple.
permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the request
        shell: bash
        env:
          REQUEST_OPERATION: ${{ inputs.operation }}
          REQUEST_PULL_REQUEST: ${{ inputs.pull_request }}
          REQUEST_REPOSITORY: ${{ github.repository }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_ACTOR: ${{ github.actor }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_SHA: ${{ github.sha }}
          REQUEST_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          operation = os.environ['REQUEST_OPERATION']
          pr = os.environ['REQUEST_PULL_REQUEST'].strip()
          allowed = ('Build now', 'Automatic: Off', 'Automatic: Selected PRs', 'Automatic: Every merged PR')
          if os.environ['REQUEST_EVENT'] != 'workflow_dispatch' or os.environ['REQUEST_REF'] != 'refs/heads/main':
              raise SystemExit('TestFlight requests must be dispatched from the default main branch.')
          if operation not in allowed or (pr and not re.fullmatch(r'[1-9][0-9]{0,8}', pr)) or (operation != 'Build now' and pr):
              raise SystemExit('Choose a supported operation; only Build now accepts a merged PR number.')
          request = dict(schemaVersion=1, operation=operation, pullRequest=pr,
                         repository=os.environ['REQUEST_REPOSITORY'], runId=os.environ['REQUEST_RUN_ID'],
                         actor=os.environ['REQUEST_ACTOR'], sourceRef=os.environ['REQUEST_REF'],
                         sourceCommit=os.environ['REQUEST_SHA'])
          pathlib.Path('request.json').write_text(json.dumps(request, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('TestFlight request recorded. The trusted Mac must acknowledge and execute it.\n\n')
              summary.write('Builds use latest qualified main containing the requested merged PR; adjacent requests may share a build.\n')
              summary.write('Mode changes remain requested until the local worker acknowledges them. No Apple upload happened in this job.\n')
          PY
      - name: Retain the durable request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powerforge-testflight-request
          path: request.json
          if-no-files-found: error
          retention-days: 90
