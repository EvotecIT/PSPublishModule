name: PowerForge Native CLI

on:
  pull_request:
    paths:
      - '.github/workflows/powerforge-native.yml'
      - 'Build/Build-Project.ps1'
      - 'Build/Test-PowerForgeNative.ps1'
      - 'Build/release.native-cli.json'
      - 'Directory.Build.props'
      - 'global.json'
      - 'PowerForge/**'
      - 'PowerForge.Cli/**'
      - 'PowerForge.Cli.Native/**'
      - 'PowerForge.ConsoleUi*/**'
      - 'PowerForge.ModuleLoader/**'
      - 'PowerForge.Modules/**'
      - 'PowerForge.Versioning/**'
      - 'PowerForge.PowerShell/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Native package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Build and verify the native preview
        id: preview
        shell: pwsh
        env:
          POWERFORGE_NATIVE_RID: ${{ matrix.rid }}
        run: |
          $rid = $env:POWERFORGE_NATIVE_RID
          $project = [xml](Get-Content -Raw ./PowerForge.Cli/PowerForge.Cli.csproj)
          $version = $project.Project.PropertyGroup.VersionPrefix
          ./Build/Build-Project.ps1 -ConfigPath ./Build/release.native-cli.json -ToolsOnly -Target PowerForgeNative -Runtimes $rid -ReleaseVersion $version -Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = (Get-Item -LiteralPath "./Artifacts/Preview/PowerForgeNative/$rid/net10.0/PowerForgeNative-$version-$rid.zip").FullName
          $installed = Join-Path $env:RUNNER_TEMP 'powerforge-installed'
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archive -DestinationPath $installed
          } else {
            unzip -q $archive -d $installed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./Build/Test-PowerForgeNative.ps1 -PackageDirectory $installed -ExpectedInformationalVersion "$version+$env:GITHUB_SHA"
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - name: Upload the verified native archive
        uses: actions/upload-artifact@v7
        with:
          name: powerforge-native-${{ matrix.rid }}
          path: ${{ steps.preview.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
