name: PowerForge Apple Advance

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact merged source ref to release.
        required: true
        type: string
      config_path:
        description: PowerForge release configuration path.
        required: false
        default: powerforge.release.json
        type: string
      source_bootstrap_script:
        description: Optional tracked PowerShell script that prepares source dependencies before planning and advancing.
        required: false
        default: ''
        type: string
      tool_manifest_path:
        description: Checked-in PowerForge tool manifest path.
        required: false
        default: .powerforge/powerforge.tool.json
        type: string
      powerforge_ref:
        description: Exact PSPublishModule commit containing the shared action.
        required: true
        type: string
      runner_labels_json:
        description: JSON array of trusted Apple runner labels.
        required: false
        default: '["self-hosted","macOS","ARM64"]'
        type: string
      tool_runtime:
        description: Runtime identifier for the trusted Apple runner.
        required: false
        default: osx-arm64
        type: string
      environment_name:
        description: Protected GitHub environment for Apple draft/TestFlight mutation.
        required: false
        default: apple-release
        type: string
    secrets:
      app_store_connect_issuer_id:
        required: false
      app_store_connect_key_id:
        required: false
      app_store_connect_private_key:
        required: false

concurrency:
  group: powerforge-apple-${{ github.repository }}
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: 120
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
    outputs:
      marketing-version: ${{ steps.advance.outputs.marketing-version }}
      build-number: ${{ steps.advance.outputs.build-number }}
      ready-for-submission: ${{ steps.advance.outputs.ready-for-submission }}
      next-actions: ${{ steps.advance.outputs.next-actions }}
    steps:
      - name: Require immutable source and shared refs
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          POWERFORGE_REF: ${{ inputs.powerforge_ref }}
        run: |
          foreach ($entry in @{ source_ref = $env:SOURCE_REF; powerforge_ref = $env:POWERFORGE_REF }.GetEnumerator()) {
            if ($entry.Value -notmatch '^[0-9A-Fa-f]{40}$') { throw "$($entry.Key) must be an exact 40-character commit SHA." }
          }

      - name: Checkout the exact merged release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Checkout the pinned shared release action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: EvotecIT/PSPublishModule
          ref: ${{ inputs.powerforge_ref }}
          fetch-depth: 1
          path: powerforge-shared
          persist-credentials: false

      - name: Verify exact checked-out commits
        shell: pwsh
        env:
          EXPECTED_SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_POWERFORGE_REF: ${{ inputs.powerforge_ref }}
        run: |
          $source = (git -C source rev-parse HEAD).Trim()
          $shared = (git -C powerforge-shared rev-parse HEAD).Trim()
          if ($source -ine $env:EXPECTED_SOURCE_REF) { throw "Expected source '$($env:EXPECTED_SOURCE_REF)', received '$source'." }
          if ($shared -ine $env:EXPECTED_POWERFORGE_REF) { throw "Expected shared '$($env:EXPECTED_POWERFORGE_REF)', received '$shared'." }

      - name: Prepare tracked source dependencies
        if: inputs.source_bootstrap_script != ''
        shell: pwsh
        env:
          SOURCE_BOOTSTRAP_SCRIPT: ${{ inputs.source_bootstrap_script }}
          EXPECTED_POWERFORGE_REF: ${{ inputs.powerforge_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = [IO.Path]::GetFullPath('${{ github.workspace }}/source').TrimEnd([IO.Path]::DirectorySeparatorChar)
          if ([IO.Path]::IsPathRooted($env:SOURCE_BOOTSTRAP_SCRIPT)) {
            throw 'source_bootstrap_script must be relative to the checked-out source.'
          }
          $scriptPath = [IO.Path]::GetFullPath((Join-Path $sourceRoot $env:SOURCE_BOOTSTRAP_SCRIPT))
          $prefix = $sourceRoot + [IO.Path]::DirectorySeparatorChar
          if (-not $scriptPath.StartsWith($prefix, [StringComparison]::Ordinal)) {
            throw 'source_bootstrap_script must resolve to a child of the checked-out source.'
          }
          if ([IO.Path]::GetExtension($scriptPath) -ine '.ps1') {
            throw 'source_bootstrap_script must identify a PowerShell .ps1 file.'
          }
          $current = $scriptPath
          while ($current -ne $sourceRoot) {
            if (Test-Path -LiteralPath $current) {
              $item = Get-Item -LiteralPath $current -Force
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "source_bootstrap_script must not traverse a symbolic link or reparse point: $current"
              }
            }
            $current = Split-Path -Parent $current
          }
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw "source_bootstrap_script was not found: $scriptPath"
          }
          $relativePath = [IO.Path]::GetRelativePath($sourceRoot, $scriptPath).Replace('\', '/')
          & git -C $sourceRoot ls-files --error-unmatch -- $relativePath *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "source_bootstrap_script must be tracked at the exact source commit: $relativePath"
          }
          & git -C $sourceRoot diff --quiet -- $relativePath
          if ($LASTEXITCODE -ne 0) {
            throw "source_bootstrap_script differs from the exact source commit: $relativePath"
          }
          & $scriptPath
          $sourceStatus = @(& git -C $sourceRoot status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $sourceStatus.Count -gt 0) {
            throw 'source_bootstrap_script must not modify tracked or untracked release source outside ignored dependency roots.'
          }

          $sharedRoot = [IO.Path]::GetFullPath('${{ github.workspace }}/powerforge-shared')
          $shared = (& git -C $sharedRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $shared -ine $env:EXPECTED_POWERFORGE_REF) {
            throw "source_bootstrap_script changed the pinned shared checkout identity: $shared"
          }
          $sharedStatus = @(& git -C $sharedRoot status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $sharedStatus.Count -gt 0) {
            throw 'source_bootstrap_script must not modify the pinned shared checkout.'
          }

      - name: Restore pinned shared checkout after source bootstrap
        if: inputs.source_bootstrap_script != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: EvotecIT/PSPublishModule
          ref: ${{ inputs.powerforge_ref }}
          fetch-depth: 1
          path: powerforge-shared
          persist-credentials: false
          clean: true

      - name: Reverify pinned shared checkout after source bootstrap
        if: inputs.source_bootstrap_script != ''
        shell: pwsh
        env:
          EXPECTED_POWERFORGE_REF: ${{ inputs.powerforge_ref }}
        run: |
          $shared = (git -C powerforge-shared rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $shared -ine $env:EXPECTED_POWERFORGE_REF) {
            throw "Expected restored shared '$($env:EXPECTED_POWERFORGE_REF)', received '$shared'."
          }
          $sharedStatus = @(& git -C powerforge-shared status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $sharedStatus.Count -gt 0) {
            throw 'Restored shared checkout is not clean.'
          }

      - name: Build exact PowerForge source
        id: build-powerforge
        uses: ./powerforge-shared/.github/actions/build-powerforge
        with:
          source-root: ${{ github.workspace }}/powerforge-shared
          runtime: ${{ inputs.tool_runtime }}

      - name: Plan safe release advancement
        id: plan
        uses: ./powerforge-shared/.github/actions/apple-release
        with:
          action: Advance
          config-path: ${{ github.workspace }}/source/${{ inputs.config_path }}
          source-commit: ${{ inputs.source_ref }}
          tool-manifest-path: ${{ github.workspace }}/source/${{ inputs.tool_manifest_path }}
          tool-path: ${{ steps.build-powerforge.outputs.tool-path }}
          plan-only: "true"
          issuer-id: ${{ secrets.app_store_connect_issuer_id }}
          key-id: ${{ secrets.app_store_connect_key_id }}
          private-key: ${{ secrets.app_store_connect_private_key }}

      - name: Advance through upload, preparation, screenshots, and configured TestFlight
        id: advance
        uses: ./powerforge-shared/.github/actions/apple-release
        with:
          action: Advance
          config-path: ${{ github.workspace }}/source/${{ inputs.config_path }}
          source-commit: ${{ inputs.source_ref }}
          tool-manifest-path: ${{ github.workspace }}/source/${{ inputs.tool_manifest_path }}
          tool-path: ${{ steps.build-powerforge.outputs.tool-path }}
          plan-only: "false"
          confirm: "true"
          issuer-id: ${{ secrets.app_store_connect_issuer_id }}
          key-id: ${{ secrets.app_store_connect_key_id }}
          private-key: ${{ secrets.app_store_connect_private_key }}

      - name: Upload compact release plan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powerforge-apple-advance-${{ inputs.source_ref }}-plan
          path: ${{ steps.plan.outputs.receipt-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload compact release action receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powerforge-apple-advance-${{ inputs.source_ref }}-actual
          path: ${{ steps.advance.outputs.receipt-path }}
          if-no-files-found: error
          retention-days: 30
